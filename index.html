<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="奶油泡泡">
<meta name="theme-color" content="#ffc2d6">
<meta name="format-detection" content="telephone=no">
<title>奶油泡泡大作战</title>
<link rel="apple-touch-icon" id="touchIcon" href="">
<style>
/* ============================================================
   奶油泡泡大作战 · Cream Bubble Battle（第二轮）
   配色延续《甜品连连看》：奶油粉 + 薄荷绿 + 柠檬黄
   ============================================================ */
:root{
  --pink:#ff6fa8; --pink2:#ff9ec7; --pink3:#ffd1e3;
  --cream:#fff8ef; --choco:#7a4436; --mint:#5fd3b0; --lemon:#ffd35c; --blue:#4aa8ff;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* 禁用 iOS 回弹 / 缩放 / 长按菜单 / 文本选择 */
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:17px;color:var(--choco);
  background:
    radial-gradient(circle at 18% 12%,rgba(255,255,255,.75),transparent 40%),
    radial-gradient(circle at 85% 90%,rgba(255,224,170,.55),transparent 45%),
    radial-gradient(rgba(255,255,255,.5) 3px,transparent 3.5px) 0 0/28px 28px,
    linear-gradient(170deg,#ffd6e5 0%,#ffe9e0 50%,#e3f8ef 100%) #ffe4ee}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
#game{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;touch-action:none}
#safeProbe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* ---------- 屏幕 ---------- */
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  padding:max(28px,var(--sat)) max(16px,var(--sar)) max(34px,var(--sab)) max(16px,var(--sal));
  background:rgba(255,228,238,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:10}
.screen.show{display:flex}
#scrMenu,#scrMode,#scrOpts,#scrChars,#scrStages{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.panel{background:linear-gradient(180deg,#fffdf8,#fff3f7);border-radius:32px;padding:24px 26px;width:100%;max-width:520px;
  max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  box-shadow:0 14px 0 #ffc2d6,0 22px 44px rgba(214,86,138,.25);border:3px solid #fff;text-align:center;
  animation:pop .38s cubic-bezier(.2,1.6,.4,1)}
.panel.wide{max-width:880px}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.title{font-size:46px;font-weight:900;line-height:1.05;color:var(--pink);letter-spacing:2px;
  text-shadow:0 3px 0 #fff,0 6px 0 #ffc2d6}
.title span{display:block;font-size:30px;color:#3fb894;text-shadow:0 3px 0 #fff,0 6px 0 #c3f0e0}
.sub{margin-top:8px;font-size:15px;opacity:.75}
#menuChars{width:100%;max-width:400px;height:auto;aspect-ratio:720/210;margin:10px auto 4px;display:block}
.btns{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.btn{min-height:58px;min-width:44px;padding:0 24px;border-radius:999px;font-size:21px;font-weight:800;color:#fff;
  background:linear-gradient(180deg,#ff9ec7,#ff6fa8);box-shadow:0 6px 0 #e0508c,0 10px 18px rgba(224,80,140,.25);
  transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px) scale(.96);box-shadow:0 2px 0 #e0508c}
.btn.mint{background:linear-gradient(180deg,#8fe6cb,#4fc9a3);box-shadow:0 6px 0 #2f9f7e,0 10px 18px rgba(47,159,126,.25)}
.btn.mint:active{box-shadow:0 2px 0 #2f9f7e}
.btn.lemon{background:linear-gradient(180deg,#ffe28a,#ffc93d);color:#7a4a00;box-shadow:0 6px 0 #d49a12,0 10px 18px rgba(212,154,18,.25)}
.btn.lemon:active{box-shadow:0 2px 0 #d49a12}
.btn.ghost{background:#fff;color:var(--pink);box-shadow:0 6px 0 #ffc2d6}
.btn.small{min-height:48px;font-size:18px;padding:0 18px}
.row2{display:flex;gap:12px}.row2 .btn{flex:1}
.best{margin-top:16px;font-size:16px;font-weight:700}
.tip{margin-top:8px;font-size:15px;opacity:.7;line-height:1.6}
h2{font-size:30px;font-weight:900;color:var(--pink);margin-bottom:12px}
h3{font-size:22px;font-weight:900;color:var(--pink);margin:8px 0 4px}
/* 设置 / 选项行 */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:2px dashed #ffd9e6;text-align:left;flex-wrap:wrap}
.set label{font-size:18px;font-weight:700}
.set small{display:block;font-size:15px;opacity:.6;font-weight:500}
.seg{display:flex;background:#ffe9f1;border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{min-width:56px;min-height:44px;padding:0 14px;border-radius:999px;font-size:17px;font-weight:700;color:#c25a86}
.seg button.on{background:#fff;color:var(--pink);box-shadow:0 3px 0 #ffc2d6}
.seg button:disabled{opacity:.35}
/* 模式卡片 */
.modeGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 4px}
.mcard{background:#fff;border-radius:24px;padding:16px 12px;min-height:130px;box-shadow:0 6px 0 #ffd9e6;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;transition:transform .12s;border:3px solid transparent}
.mcard:active{transform:scale(.95)}
.mcard .em{font-size:40px;font-family:var(--emoji)}
.mcard b{font-size:20px;color:var(--pink)}
.mcard small{font-size:15px;opacity:.65;line-height:1.35}
.mcard.mint{box-shadow:0 6px 0 #c3f0e0}.mcard.mint b{color:#2f9f7e}
.mcard.lemon{box-shadow:0 6px 0 #ffe7a6}.mcard.lemon b{color:#c98a00}
.mcard.blue{box-shadow:0 6px 0 #cfe6ff}.mcard.blue b{color:#2f7fd0}
/* 角色选择 */
.charSides{display:flex;gap:16px;align-items:stretch}
.charSide{flex:1;background:#fff;border-radius:24px;padding:12px;box-shadow:0 5px 0 #ffd9e6}
.charSide.p2{box-shadow:0 5px 0 #cfe6ff}
.charSide h3.p2{color:#2f7fd0}
.charGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.ccard{background:#fff8fb;border-radius:20px;padding:6px 4px 8px;min-height:44px;border:3px solid transparent;display:flex;flex-direction:column;align-items:center;transition:transform .12s}
.ccard canvas{width:84px;height:84px}
.ccard span{font-size:16px;font-weight:800}
.ccard.on{border-color:var(--pink);background:#ffeef5}
.ccard.on.p2{border-color:var(--blue);background:#eef6ff}
.ccard:disabled{opacity:.3}
.ccard:active{transform:scale(.95)}
/* 关卡选择（甜品连连看风格网格卡片） */
.stageGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0}
.scard{position:relative;border-radius:22px;padding:10px 6px;min-height:112px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 6px 0 rgba(0,0,0,.15);transition:transform .12s;border:3px solid #fff}
.scard:active{transform:scale(.94)}
.scard .no{font-size:30px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.scard .nm{font-size:15px;font-weight:800;line-height:1.2}
.scard .st{font-size:17px;letter-spacing:1px;margin-top:2px;color:#fff7c2;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.scard .gl{position:absolute;top:6px;right:8px;font-size:17px;font-family:var(--emoji)}
.scard.lock{filter:grayscale(.85);opacity:.6}
.scard.lock::after{content:"🔒";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-family:var(--emoji);background:rgba(255,255,255,.35);border-radius:19px}
@media (max-width:700px){.stageGrid{grid-template-columns:repeat(3,1fr)}}
/* 结算 */
.big{font-size:64px;line-height:1.1}
.stars{font-size:40px;letter-spacing:6px;color:#ffc93d;text-shadow:0 3px 0 #fff}
.resPlayers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.pcard{background:#fff;border-radius:18px;padding:8px 10px 10px;box-shadow:0 4px 0 #ffd9e6;text-align:center;border:3px solid transparent}
.pcard.p1{border-color:var(--pink)}.pcard.p2{border-color:var(--blue)}
.pcard.win{background:#fffbe6}
.pcard canvas{width:56px;height:56px}
.pcard .who{font-size:16px;font-weight:900}
.pcard .row{display:flex;justify-content:space-between;font-size:15px;padding:1px 4px}
.pcard .row b{color:var(--pink)}
.newrec{color:#e0a800;font-weight:900;font-size:18px;animation:pop .5s}
/* 新手引导 */
#tutorCv{width:100%;max-width:440px;aspect-ratio:440/250;height:auto;display:block;margin:0 auto;background:#fff8fb;border-radius:22px}
.dots{display:flex;justify-content:center;gap:8px;margin:10px 0 0}
.dots i{width:10px;height:10px;border-radius:50%;background:#ffd1e3}.dots i.on{background:var(--pink);width:24px;border-radius:5px}
/* 自测 */
#testList{text-align:left;font-size:15px;line-height:1.5;margin:10px 0;max-height:52vh;overflow:auto;touch-action:pan-y;
  background:#fff;border-radius:16px;padding:10px 14px}
#testList div{padding:3px 0;border-bottom:1px solid #ffeef4}
#testList small{opacity:.6}
/* 游戏内暂停按钮（DOM，位置由 Layout 计算） */
#btnPause{position:fixed;display:none;z-index:5;border-radius:16px;background:rgba(255,255,255,.9);
  box-shadow:0 4px 0 #ffc2d6;color:var(--pink);font-weight:900}
#btnPause:active{transform:scale(.92)}
#btnPause.show{display:flex;align-items:center;justify-content:center;gap:6px}
#btnPause i{display:block;width:6px;height:20px;border-radius:3px;background:var(--pink)}
/* toast */
#toast{position:fixed;left:50%;top:max(34px,calc(var(--sat) + 10px));transform:translate(-50%,-140%);opacity:0;visibility:hidden;z-index:60;pointer-events:none;
  background:#fff;color:var(--choco);font-weight:800;font-size:17px;padding:12px 22px;border-radius:999px;box-shadow:0 6px 0 #ffc2d6,0 10px 24px rgba(214,86,138,.25);
  transition:transform .35s cubic-bezier(.2,1.5,.4,1),opacity .25s,visibility .35s;white-space:nowrap}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
/* 条纹过场 */
#wipe{position:fixed;inset:-10px;z-index:50;pointer-events:none;transform:translateX(-120%);
  transition:transform .36s cubic-bezier(.7,0,.3,1);
  background:repeating-linear-gradient(-45deg,#ff9ec7 0 44px,#ffd35c 44px 88px,#8fe6cb 88px 132px,#fff8ef 132px 176px)}
#wipe.in{transform:translateX(0)}
#wipe.out{transform:translateX(120%)}
#wipe.noanim{transition:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safeProbe"></div>
<button id="btnPause" aria-label="暂停"><i></i><i></i></button>

<!-- 主菜单 -->
<section id="scrMenu" class="screen show"><div class="panel">
  <div class="title">奶油泡泡<span>大作战</span></div>
  <div class="sub">放下奶油泡泡，把对手困住再碰一下！</div>
  <canvas id="menuChars" width="720" height="210"></canvas>
  <div class="btns">
    <button class="btn" data-act="modes">▶️ 开始游戏</button>
    <div class="row2">
      <button class="btn mint" data-act="settings">⚙️ 设置</button>
      <button class="btn lemon" data-act="tests">🧪 自测</button>
    </div>
  </div>
  <p class="best" id="bestLine"></p>
  <p class="tip">摇杆移动 · 🫧 放泡泡 · 🍭 自救 · 支持手柄<br>键盘单人：WASD/方向键 · 空格 · Q　双人：P2 方向键 · 回车 · 右 Shift</p>
</div></section>

<!-- 模式选择 -->
<section id="scrMode" class="screen"><div class="panel">
  <h2>选择模式</h2>
  <div class="modeGrid">
    <button class="mcard" data-act="mode" data-mode="practice"><span class="em">🎯</span><b>练习场</b><small>新手入口<br>vs 3 个木头人</small></button>
    <button class="mcard mint" data-act="mode" data-mode="battle"><span class="em">⚔️</span><b>单人对战</b><small>vs AI 混战<br>或 2v2 组队</small></button>
    <button class="mcard blue" data-act="mode" data-mode="duo"><span class="em">👯</span><b>同屏双人</b><small>合作 / 对战<br>一台 iPad 两人玩</small></button>
    <button class="mcard lemon" data-act="mode" data-mode="stage"><span class="em">🗺️</span><b>闯关</b><small>12 关机关挑战<br>收集 ⭐⭐⭐</small></button>
  </div>
  <div class="btns"><button class="btn ghost small" data-act="menu">返回</button></div>
</div></section>

<!-- 模式选项 -->
<section id="scrOpts" class="screen"><div class="panel">
  <h2 id="optTitle">选项</h2>
  <div id="optBody"></div>
  <div class="btns">
    <button class="btn" data-act="toChars">下一步：选角色</button>
    <button class="btn ghost small" data-act="modes">返回</button>
  </div>
</div></section>

<!-- 角色选择 -->
<section id="scrChars" class="screen"><div class="panel wide">
  <h2 id="charTitle">选择角色</h2>
  <div id="charBody"></div>
  <div class="btns">
    <button class="btn" data-act="go">开始！</button>
    <button class="btn ghost small" data-act="charsBack">返回</button>
  </div>
</div></section>

<!-- 关卡选择 -->
<section id="scrStages" class="screen"><div class="panel wide">
  <h2>🗺️ 闯关</h2>
  <div id="starSum" class="sub"></div>
  <div class="stageGrid" id="stageGrid"></div>
  <div class="btns"><button class="btn ghost small" data-act="modes">返回</button></div>
</div></section>

<!-- 新手引导 -->
<section id="scrTutor" class="screen"><div class="panel">
  <canvas id="tutorCv" width="880" height="500"></canvas>
  <h3 id="tutorTitle"></h3>
  <p class="tip" id="tutorText" style="opacity:.85"></p>
  <div class="dots" id="tutorDots"><i></i><i></i><i></i></div>
  <div class="row2" style="margin-top:14px">
    <button class="btn ghost small" data-act="tutorSkip">跳过</button>
    <button class="btn small" data-act="tutorNext" id="tutorNextBtn">下一页</button>
  </div>
</div></section>

<!-- 暂停 -->
<section id="scrPause" class="screen"><div class="panel">
  <h2>⏸ 暂停中</h2>
  <div class="btns">
    <button class="btn" data-act="resume">▶️ 继续</button>
    <button class="btn mint" data-act="restart">🔄 重新开始</button>
    <button class="btn lemon" data-act="settings">⚙️ 设置</button>
    <button class="btn ghost" data-act="menu">🏠 主菜单</button>
  </div>
</div></section>

<!-- 设置 -->
<section id="scrSettings" class="screen"><div class="panel">
  <h2>⚙️ 设置</h2>
  <div class="set"><label>操作手</label><div class="seg" data-key="lefty"><button data-val="false">右手</button><button data-val="true">左手</button></div></div>
  <div class="set"><label>按钮大小</label><div class="seg" data-key="btnSize"><button data-val="S">S</button><button data-val="M">M</button><button data-val="L">L</button></div></div>
  <div class="set"><label>摇杆</label><div class="seg" data-key="joyFixed"><button data-val="false">浮动</button><button data-val="true">固定</button></div></div>
  <div class="set"><label>音效</label><div class="seg" data-key="mute"><button data-val="false">开</button><button data-val="true">静音</button></div></div>
  <div class="set"><label>AI 难度默认</label><div class="seg" data-key="defaultDiff"><button data-val="easy">简单</button><button data-val="normal">普通</button><button data-val="hard">困难</button></div></div>
  <div class="set"><label>地图尺寸<small id="mapSizeNote">大地图仅横屏可选</small></label><div class="seg" data-key="mapSize"><button data-val="std">标准 15×13</button><button data-val="large">大 19×13</button></div></div>
  <div class="btns">
    <div class="row2">
      <button class="btn mint small" data-act="tutor">📖 新手引导</button>
      <button class="btn lemon small" data-act="tests">🧪 自测</button>
    </div>
    <button class="btn" data-act="back">完成</button>
  </div>
</div></section>

<!-- 结算 -->
<section id="scrResult" class="screen"><div class="panel wide">
  <div class="big" id="resEmoji">🏆</div>
  <h2 id="resTitle">胜利！</h2>
  <div id="resReason" class="sub"></div>
  <div id="resStars" class="stars"></div>
  <div id="resPlayers" class="resPlayers"></div>
  <div id="resScore" class="best"></div>
  <div id="resNew" class="newrec"></div>
  <div class="btns">
    <button class="btn lemon" data-act="nextStage" id="btnNextStage">➡️ 下一关</button>
    <div class="row2">
      <button class="btn" data-act="restart">🔄 再来一局</button>
      <button class="btn ghost" data-act="menu">🏠 主菜单</button>
    </div>
  </div>
</div></section>

<!-- 自测 -->
<section id="scrTests" class="screen"><div class="panel">
  <h2>🧪 自测结果</h2>
  <div id="testSum" style="font-weight:800;font-size:18px"></div>
  <div id="testList"></div>
  <div class="btns"><button class="btn" data-act="testsBack">返回</button></div>
</div></section>

<div id="toast"></div>
<div id="wipe"></div>

<script>
'use strict';
/* =====================================================================
   1. CONFIG：所有关键数值集中在这里
   ===================================================================== */
// 闯关 12 关：逐步引入 传送门 / 传送带 / 冰面 / 草丛 / 限时缩圈
// features 坐标约定：ice/grass 为 [x, y, w, h] 矩形；belts 为 {x, y, len, dir}；portals 为成对坐标
const STAGES = [
  { no: 1,  name: '初次见面',   desc: '淘汰 1 个对手',                 goal: { type: 'eliminate' }, time: 150, enemies: ['easy'], boxCount: { min: 45, max: 55 } },
  { no: 2,  name: '甜品仓库',   desc: '炸光 6 个带 ⭐ 的甜品箱',        goal: { type: 'boxes' }, targets: 6, time: 120, enemies: ['easy'] },
  { no: 3,  name: '传送门',     desc: '踩上传送门，瞬移到另一端',       goal: { type: 'eliminate' }, time: 150, enemies: ['easy', 'easy'],
    features: { portals: [[[4, 6], [10, 6]]] } },
  { no: 4,  name: '双门迷踪',   desc: '坚持生存 75 秒',                 goal: { type: 'survive' }, time: 75, enemies: ['normal', 'easy'],
    features: { portals: [[[4, 2], [10, 10]], [[10, 2], [4, 10]]] } },
  { no: 5,  name: '传送带工厂', desc: '传送带会推动角色和泡泡',         goal: { type: 'eliminate' }, time: 150, enemies: ['easy', 'normal'],
    features: { belts: [{ x: 2, y: 4, len: 11, dir: 'right' }, { x: 12, y: 8, len: 11, dir: 'left' }] } },
  { no: 6,  name: '流水线',     desc: '炸光 8 个带 ⭐ 的箱子',          goal: { type: 'boxes' }, targets: 8, time: 150, enemies: ['normal'],
    features: { belts: [{ x: 6, y: 2, len: 9, dir: 'down' }, { x: 8, y: 10, len: 9, dir: 'up' }] } },
  { no: 7,  name: '冰淇淋滑道', desc: '冰面上松开方向会一直滑到障碍',   goal: { type: 'eliminate' }, time: 150, enemies: ['normal', 'easy'],
    features: { ice: [[3, 3, 9, 7]] } },

/* =====================================================================
   3. Logic：纯规则层（不碰 DOM），AI / 测试可直接复用
   ===================================================================== */
const Logic = (() => {
  const EMPTY = 0, WALL = 1, BOX = 2;
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const DIR_KEYS = ['up', 'down', 'left', 'right'];
  const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
  const NO_INTENT = Object.freeze({ dir: null, bomb: false, rescue: false });

  // 可复现随机数（mulberry32）
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const inB = (s, x, y) => x >= 0 && y >= 0 && x < s.cols && y < s.rows;
  const idx = (s, x, y) => y * s.cols + x;
  const emit = (s, type, data) => { s.events.push(Object.assign({ type }, data)); };
  const tileAt = (s, x, y) => inB(s, x, y) ? s.tiles[idx(s, x, y)] : null;

  // —— 泡泡对象池 ——
  const bubblePool = [];
  const allocBubble = () => bubblePool.pop() || {};
  const freeBubble = b => { b.slide = null; bubblePool.push(b); };

  // —— 地图生成 ——
  function spawnSafeCells(cols, rows, sx, sy, r) {
    const out = [];
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.abs(dx) + Math.abs(dy) > r) continue;
      const x = sx + dx, y = sy + dy;
      if (x >= 0 && y >= 0 && x < cols && y < rows) out.push([x, y]);
    }
    return out;
  }
  const spawnsOf = (m, cols, rows) => m.spawns || [[0, 0], [cols - 1, rows - 1], [cols - 1, 0], [0, rows - 1]];
  function pickWeighted(weights, r) {
    let total = 0; for (const k in weights) total += weights[k];
    let v = r * total;
    for (const k in weights) { v -= weights[k]; if (v < 0) return k; }
    return Object.keys(weights)[0];
  }
  // 机关：写入 tiles（null 或 {type:'ice'|'grass'|'belt'|'portal', dir, id}），机关格不随机放箱子
  function applyFeatures(F, cols, rows, grid, tiles, portalPair) {
    if (!F) return;
    const put = (x, y, t, force) => {
      if (x < 0 || y < 0 || x >= cols || y >= rows) return;
      const k = y * cols + x;
      if (force) grid[k] = EMPTY; else if (grid[k] === WALL) return;
      tiles[k] = t;
    };
    for (const [x0, y0, w, h] of F.ice || []) for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) put(x, y, { type: 'ice' });
    for (const [x0, y0, w, h] of F.grass || []) for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) put(x, y, { type: 'grass' });
    for (const b of F.belts || []) { const [dx, dy] = DIRS[b.dir]; for (let i = 0; i < b.len; i++) put(b.x + dx * i, b.y + dy * i, { type: 'belt', dir: b.dir }, true); }
    (F.portals || []).forEach(([a, b], i) => {
      put(a[0], a[1], { type: 'portal', id: i }, true); put(b[0], b[1], { type: 'portal', id: i }, true);
      const ka = a[1] * cols + a[0], kb = b[1] * cols + b[0];
      portalPair.set(ka, kb); portalPair.set(kb, ka);
    });
  }
  function generateMap(mapCfg, seed, cols = mapCfg.cols || CONFIG.cols, rows = mapCfg.rows || CONFIG.rows) {
    const R = rng(seed), n = cols * rows;
    const grid = new Uint8Array(n), hidden = new Array(n).fill(null), safe = new Uint8Array(n);
    const tiles = new Array(n).fill(null), portalPair = new Map(), targets = new Set();
    const cand = [];
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      let ch = '?';
      if (mapCfg.layout) ch = mapCfg.layout[y][x];
      else if (x % 2 === 1 && y % 2 === 1) ch = '#';
      const k = y * cols + x;
      if (ch === '#') grid[k] = WALL; else if (ch === 'B') grid[k] = BOX;
      else if (ch === '?') cand.push(k);
    }
    applyFeatures(mapCfg.features, cols, rows, grid, tiles, portalPair);
    // 出生角周围清空（含柱子）
    const spawns = spawnsOf(mapCfg, cols, rows);
    for (const [sx, sy] of spawns)
      for (const [x, y] of spawnSafeCells(cols, rows, sx, sy, mapCfg.spawnClear)) { const k = y * cols + x; grid[k] = EMPTY; safe[k] = 1; }
    const pool = cand.filter(k => !safe[k] && grid[k] === EMPTY && !tiles[k]);
    for (let i = pool.length - 1; i > 0; i--) { const j = (R() * (i + 1)) | 0; [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const { min, max } = mapCfg.boxCount;
    const target = Math.min(pool.length, min + Math.floor(R() * (max - min + 1)));
    for (let i = 0; i < target; i++) grid[pool[i]] = BOX;
    let boxCount = 0;
    for (let k = 0; k < n; k++) if (grid[k] === BOX) {
      boxCount++;
      if (R() < CONFIG.items.dropRate) hidden[k] = pickWeighted(CONFIG.items.weights, R());
    }
    // 闯关目标箱（炸光指定箱子）：从已放置的箱子中挑选
    if (mapCfg.targets > 0) {
      const boxes = pool.slice(0, target);
      for (let i = 0; i < Math.min(mapCfg.targets, boxes.length); i++) targets.add(boxes[i]);
    }
    return { grid, hidden, safe, boxCount, tiles, portalPair, targets, spawns, cols, rows };
  }

  // —— 状态 ——
  function baseState(cols, rows) {
    const n = cols * rows;
    return { cols, rows, grid: new Uint8Array(n), hidden: new Array(n).fill(null), items: new Array(n).fill(null),
      tiles: new Array(n).fill(null), portalPair: new Map(), targets: new Set(), targetsTotal: 0,
      bubbles: [], flames: [], flameGrid: new Float32Array(n), flameOwner: new Int32Array(n),
      players: [], time: 0, timeLeft: Infinity, timeLimit: Infinity, phase: 'play', countdown: 0, mode: 'sandbox',
      goal: null, shrink: null, teamMode: false, spawns: [], stage: null,
      result: null, events: [], nextId: 1, rand: rng(1), mapId: null };
  }
  function createEmptyState(cols, rows) { return baseState(cols, rows); }
  function makePlayer(d, x, y) {
    const st = CONFIG.player.start;
    return { id: d.id, team: d.team, charKey: d.charKey || 'bunny', gray: !!d.gray, human: !!d.human,
      slot: d.slot != null ? d.slot : null, label: d.label || null, ai: d.ai || null,
      color: d.color || null, controller: d.controller || null,
      x, y, px: x, py: y, dir: 'down', moving: false, walk: 0, slideDir: null, sliding: false, portalLock: -1,
      stats: { bubbles: st.bubbles, power: st.power, speed: st.speed }, lollipop: 0, glove: false, curse: null,
      state: 'alive', trapT: 0, trappedBy: null, invuln: 0, kills: 0, rescues: 0, traps: 0, deathTime: null, aliveTime: 0 };
  }
  // 缩圈：从最外圈螺旋向内的落墙顺序（不含原有墙与中央保留区）
  function makeShrink(s) {
    const C = CONFIG.shrink, order = [];
    const kx0 = Math.floor((s.cols - C.keepW) / 2), ky0 = Math.floor((s.rows - C.keepH) / 2);
    const keep = (x, y) => x >= kx0 && x < kx0 + C.keepW && y >= ky0 && y < ky0 + C.keepH;
    const seen = new Set();
    for (let r = 0; r * 2 < Math.min(s.cols, s.rows); r++) {
      const x0 = r, y0 = r, x1 = s.cols - 1 - r, y1 = s.rows - 1 - r, ring = [];
      for (let x = x0; x <= x1; x++) ring.push([x, y0]);
      for (let y = y0 + 1; y <= y1; y++) ring.push([x1, y]);
      for (let x = x1 - 1; x >= x0 && y1 > y0; x--) ring.push([x, y1]);
      for (let y = y1 - 1; y > y0 && x1 > x0; y--) ring.push([x0, y]);
      for (const [x, y] of ring) { const k = idx(s, x, y); if (seen.has(k) || keep(x, y) || s.grid[k] === WALL) continue; seen.add(k); order.push(k); }
    }
    return { order, i: 0, interval: (C.start - C.end) / Math.max(1, order.length) };
  }
  function createState(o) {
    const map = o.map || CONFIG.maps[o.mapIndex || 0];
    const gen = generateMap(map, o.seed);
    const s = baseState(gen.cols, gen.rows);
    s.grid = gen.grid; s.hidden = gen.hidden; s.tiles = gen.tiles; s.portalPair = gen.portalPair;
    s.targets = gen.targets; s.targetsTotal = gen.targets.size; s.spawns = gen.spawns; s.mapId = map.id;
    s.mode = o.mode || 'practice'; s.phase = 'countdown'; s.countdown = CONFIG.match.countdown;
    s.timeLeft = o.timeLimit != null ? o.timeLimit : (map.time || CONFIG.match.practiceTime);
    s.timeLimit = s.timeLeft;
    s.goal = o.goal || map.goal || { type: 'eliminate' };
    s.teamMode = !!o.teamMode; s.stage = map.stage ? map : null;
    s.rand = rng((o.seed ^ 0x9e3779b9) >>> 0);
    o.players.forEach((d, i) => { const [sx, sy] = gen.spawns[d.spawn != null ? d.spawn : i]; s.players.push(makePlayer(d, sx, sy)); });
    if (o.shrink != null ? o.shrink : map.shrink) s.shrink = makeShrink(s);
    return s;
  }

  // —— 查询 ——
  const bubbleAt = (s, x, y, except) => { for (const b of s.bubbles) if (b !== except && b.x === x && b.y === y) return b; return null; };
  const countOwned = (s, id) => s.bubbles.reduce((n, b) => n + (b.owner === id ? 1 : 0), 0);
  const speedOf = p => (p.curse && p.curse.type === 'slow') ? CONFIG.player.curseSlowSpeed
    : CONFIG.player.baseSpeed + CONFIG.player.speedStep * p.stats.speed;
  function isBlockedFor(s, x, y, p) {
    if (!inB(s, x, y)) return true;
    if (s.grid[idx(s, x, y)] !== EMPTY) return true;
    const b = bubbleAt(s, x, y);
    if (b && !(p && Math.round(p.x) === x && Math.round(p.y) === y)) return true;   // 站在自己刚放的泡泡上可以离开
    return false;
  }

  // —— 移动（含转角辅助）——
  // 返回实际移动距离。坐标约定：整数 = 格子中心。noPush：传送带推动时不触发推泡泡
  function movePlayer(s, p, dir, dist, noPush) {
    const [dx, dy] = DIRS[dir], horiz = dx !== 0;
    const main = horiz ? 'x' : 'y', side = horiz ? 'y' : 'x', sgn = horiz ? dx : dy;
    p.dir = dir;
    let moved = 0;
    for (let guard = 0; guard < 3 && dist > 1e-6; guard++) {
      const cm = Math.round(p[main]), cs = Math.round(p[side]);
      const off = p[side] - cs;
      const cell = (m, sd) => horiz ? [m, sd] : [sd, m];
      const [nx, ny] = cell(cm + sgn, cs);
      const blocked = isBlockedFor(s, nx, ny, p);
      if (Math.abs(off) > 1e-4) {
        // 偏离通道：不足阈值则自动滑入；或者两条通道都畅通（空旷处）也对齐
        const os = cs + Math.sign(off);
        const [ax, ay] = cell(cm, os), [bx, by] = cell(cm + sgn, os);
        const otherOpen = !isBlockedFor(s, ax, ay, p) && !isBlockedFor(s, bx, by, p);
        if (!blocked && (Math.abs(off) <= CONFIG.player.cornerAssist + 1e-6 || otherOpen)) {
          const d = Math.min(dist, Math.abs(off));
          p[side] -= Math.sign(off) * d; dist -= d; moved += d;
          if (Math.abs(p[side] - cs) < 1e-4) p[side] = cs;
          continue;
        }
        return moved;
      }
      p[side] = cs;
      const rel = (p[main] - cm) * sgn;                // >0 表示已越过中心
      if (blocked) {
        if (rel < 0) { const d = Math.min(dist, -rel); p[main] += sgn * d; moved += d; }
        else if (!noPush) {
          const b = bubbleAt(s, nx, ny);
          if (b && p.glove && s.grid[idx(s, nx, ny)] === EMPTY) startPush(s, b, horiz ? sgn : 0, horiz ? 0 : sgn);
        }
        return moved;
      }
      const step = Math.min(dist, 0.5);
      p[main] += sgn * step; dist -= step; moved += step;
      if (Math.abs(p[main] - Math.round(p[main])) < 1e-7) p[main] = Math.round(p[main]);   // 消除浮点误差
    }
    return moved;
  }

  // —— 推泡泡 / 传送带推动泡泡 ——
  function canSlideInto(s, x, y) {
    if (!inB(s, x, y) || s.grid[idx(s, x, y)] !== EMPTY || bubbleAt(s, x, y)) return false;
    for (const p of s.players) if (p.state !== 'dead' && Math.round(p.x) === x && Math.round(p.y) === y) return false;
    return true;
  }
  function startPush(s, b, dx, dy) {
    if (b.slide || !canSlideInto(s, b.x + dx, b.y + dy)) return false;
    b.slide = { dx, dy, prog: 0 }; emit(s, 'push', { x: b.x, y: b.y }); return true;
  }

  // —— 放泡泡（自动对齐格子中心）——
  function placeBubble(s, p) {
    if (p.state !== 'alive') return null;
    if (p.curse && p.curse.type === 'nobomb') return null;
    const cx = Math.round(p.x), cy = Math.round(p.y);
    if (!inB(s, cx, cy) || s.grid[idx(s, cx, cy)] !== EMPTY || bubbleAt(s, cx, cy)) return null;
    if (countOwned(s, p.id) >= p.stats.bubbles) return null;
    p.x = cx; p.y = cy;
    const b = allocBubble();
    b.id = s.nextId++; b.x = cx; b.y = cy; b.owner = p.id; b.power = p.stats.power;
    b.fuse = CONFIG.bubble.fuse; b.t = CONFIG.bubble.fuse; b.slide = null;
    s.bubbles.push(b);
    emit(s, 'place', { x: cx, y: cy, owner: p.id });
    return b;
  }

  // —— 单个泡泡的十字范围（不含连锁）——
  function spreadFrom(s, b) {
    const cells = [{ x: b.x, y: b.y, dir: 'c', end: false }], boxes = [], hits = [];
    for (const d of DIR_KEYS) {
      const [dx, dy] = DIRS[d];
      let last = null;
      for (let i = 1; i <= b.power; i++) {
        const x = b.x + dx * i, y = b.y + dy * i;
        if (!inB(s, x, y) || s.grid[idx(s, x, y)] === WALL) { if (last) last.end = true; break; }
        const c = { x, y, dir: d, end: i === b.power };
        cells.push(c); last = c;
        if (s.grid[idx(s, x, y)] === BOX) { boxes.push({ x, y }); c.end = true; break; }   // 炸掉第一个箱子后停止
        const ob = bubbleAt(s, x, y, b);
        if (ob) { hits.push(ob); c.end = true; break; }
      }
    }
    return { cells, boxes, hits };
  }

  // —— 爆炸范围（含连锁）：AI 直接复用 ——
  function getBlastCells(s, bubble) {
    const queue = [bubble], seen = new Set([bubble]), chain = [];
    const cellMap = new Map(), boxMap = new Map();
    while (queue.length) {
      const b = queue.shift(); chain.push(b);
      const r = spreadFrom(s, b);
      for (const c of r.cells) {
        const k = idx(s, c.x, c.y), e = cellMap.get(k);
        if (!e || c.dir === 'c') cellMap.set(k, { x: c.x, y: c.y, dir: c.dir, end: c.end, owner: b.owner });
        else if (e.dir !== 'c') {
          const eh = e.dir === 'left' || e.dir === 'right', ch = c.dir === 'left' || c.dir === 'right';
          if (eh !== ch) { e.dir = 'x'; e.end = false; } else if (!c.end) e.end = false;
        }
      }
      for (const bx of r.boxes) boxMap.set(idx(s, bx.x, bx.y), bx);
      for (const h of r.hits) if (!seen.has(h)) { seen.add(h); queue.push(h); }
    }
    return { cells: [...cellMap.values()], boxes: [...boxMap.values()], bubbles: chain };
  }

  // —— 危险图：每格多少秒后爆炸（Infinity = 安全，0 = 正在燃烧）——
  function getDangerMap(s) {
    const n = s.cols * s.rows, m = new Float32Array(n).fill(Infinity);
    const t = new Map(), sp = new Map();
    for (const b of s.bubbles) { t.set(b, Math.max(0, b.t)); sp.set(b, spreadFrom(s, b)); }
    // 连锁：被波及的泡泡取最早时间（迭代到稳定）
    let changed = true, guard = 0;
    while (changed && guard++ < 64) {
      changed = false;
      for (const b of s.bubbles) {
        const tb = t.get(b);
        for (const h of sp.get(b).hits) if (t.get(h) > tb) { t.set(h, tb); changed = true; }
      }
    }
    for (const b of s.bubbles) { const tb = t.get(b); for (const c of sp.get(b).cells) { const k = idx(s, c.x, c.y); if (tb < m[k]) m[k] = tb; } }
    for (let k = 0; k < n; k++) if (s.flameGrid[k] > 0) m[k] = 0;
    return m;
  }

  // —— 爆炸 ——
  function explode(s, bubble) {
    const r = getBlastCells(s, bubble);
    const chainSet = new Set(r.bubbles);
    s.bubbles = s.bubbles.filter(b => !chainSet.has(b));
    const boxKeys = new Set(r.boxes.map(b => idx(s, b.x, b.y)));
    const ft = CONFIG.bubble.flameTime;
    for (const c of r.cells) {
      const k = idx(s, c.x, c.y);
      if (!boxKeys.has(k) && s.items[k]) { emit(s, 'itemBurn', { x: c.x, y: c.y }); s.items[k] = null; }
      s.flames.push({ x: c.x, y: c.y, dir: c.dir, end: c.end, t: ft, owner: c.owner });
      if (s.flameGrid[k] < ft) { s.flameGrid[k] = ft; s.flameOwner[k] = c.owner; }
    }
    for (const bx of r.boxes) {
      const k = idx(s, bx.x, bx.y);
      s.grid[k] = EMPTY;
      if (s.hidden[k]) { s.items[k] = s.hidden[k]; s.hidden[k] = null; }
      const wasTarget = s.targets.delete(k);
      emit(s, 'box', { x: bx.x, y: bx.y, item: s.items[k], target: wasTarget });
    }
    emit(s, 'explode', { x: bubble.x, y: bubble.y, chain: r.bubbles.length, cells: r.cells.map(c => ({ x: c.x, y: c.y, end: c.end })) });
    r.bubbles.forEach(freeBubble);
    return r;
  }

  // —— 被困状态机 ——
  function trapPlayer(s, p, byId) {
    if (p.state !== 'alive' || p.invuln > 0) return false;
    p.state = 'trapped'; p.trapT = CONFIG.trap.time; p.trappedBy = byId; p.moving = false; p.traps++;
    p.slideDir = null; p.sliding = false;
    p.x = Math.round(p.x); p.y = Math.round(p.y); p.px = p.x; p.py = p.y;
    emit(s, 'trap', { id: p.id, x: p.x, y: p.y, by: byId });
    return true;
  }
  function rescuePlayer(s, p, how, byId) {
    if (p.state !== 'trapped') return false;
    p.state = 'alive'; p.trapT = 0; p.trappedBy = null; p.invuln = CONFIG.trap.invulnAfterRescue;
    if (how === 'mate') { const m = s.players.find(q => q.id === byId); if (m) m.rescues++; }
    emit(s, 'rescue', { id: p.id, x: p.x, y: p.y, how, by: byId });
    return true;
  }
  function eliminatePlayer(s, p, killerId, how) {
    if (p.state === 'dead') return false;
    p.state = 'dead'; p.deathTime = s.time; p.moving = false;
    const k = s.players.find(q => q.id === killerId);
    if (k && k.team !== p.team) k.kills++;
    emit(s, 'eliminate', { id: p.id, x: p.x, y: p.y, by: killerId, how });
    return true;
  }

  // —— 道具 ——
  function applyItem(s, p, type) {
    const L = CONFIG.limits;
    switch (type) {
      case 'bubble': p.stats.bubbles = Math.min(L.bubbles, p.stats.bubbles + 1); break;
      case 'power': p.stats.power = Math.min(L.power, p.stats.power + 1); break;
      case 'speed': p.stats.speed = Math.min(L.speed, p.stats.speed + 1); break;
      case 'lollipop': p.lollipop = Math.min(L.lollipop, p.lollipop + 1); break;
      case 'glove': p.glove = true; break;
      case 'curse': {
        const list = CONFIG.items.curses;
        p.curse = { type: list[(s.rand() * list.length) | 0], t: CONFIG.items.curseTime }; break;
      }
    }
    emit(s, 'pickup', { id: p.id, item: type, x: p.x, y: p.y, curse: p.curse && type === 'curse' ? p.curse.type : null });
  }

  // —— 缩圈落墙 ——
  function dropWall(s, k) {
    const x = k % s.cols, y = (k / s.cols) | 0;
    s.grid[k] = WALL; s.tiles[k] = null; s.items[k] = null; s.hidden[k] = null; s.targets.delete(k);
    s.flameGrid[k] = 0;
    s.bubbles = s.bubbles.filter(b => { if (b.x === x && b.y === y) { freeBubble(b); return false; } return true; });
    for (const p of s.players) if (p.state !== 'dead' && Math.round(p.x) === x && Math.round(p.y) === y) eliminatePlayer(s, p, null, 'crush');
    emit(s, 'drop', { x, y });
  }
  function updateShrink(s) {
    const sh = s.shrink; if (!sh || s.timeLeft > CONFIG.shrink.start) return;
    const elapsed = CONFIG.shrink.start - s.timeLeft;
    const want = Math.min(sh.order.length, Math.floor(elapsed / sh.interval) + 1);
    while (sh.i < want) dropWall(s, sh.order[sh.i++]);
  }
  // 接下来将要落下的墙块（渲染预警 / AI 避让），返回 [{k, t}]，t 为距落下的秒数
  function upcomingDrops(s, ahead = CONFIG.shrink.warnAhead) {
    const sh = s.shrink, out = []; if (!sh) return out;
    const elapsed = CONFIG.shrink.start - s.timeLeft;
    for (let j = sh.i; j < sh.order.length; j++) {
      const t = j * sh.interval - elapsed;
      if (t > ahead) break;
      out.push({ k: sh.order[j], t: Math.max(0, t) });
    }
    return out;
  }

  // —— 胜负判定 ——
  // practice/stage：玩家（及队友）对 AI，按 goal 判定；battle/duo：最后存活的一方获胜
  function checkOutcome(s) {
    if (s.result || s.mode === 'sandbox') return s.result;
    const alive = s.players.filter(p => p.state !== 'dead');
    const humans = s.players.filter(p => p.human);
    const humanTeams = new Set(humans.map(p => p.team));
    const humansAlive = humans.some(p => p.state !== 'dead');
    const goal = s.goal || { type: 'eliminate' };
    let r = null;
    if (goal.type === 'lastTeam') {
      const teams = new Set(alive.map(p => p.team));
      if (teams.size <= 1) { const t = teams.size ? [...teams][0] : null; r = { winnerTeam: t, reason: t == null ? 'draw' : 'last' }; }
      else if (!humansAlive) r = { winnerTeam: null, reason: 'eliminated', loserHumans: true };
      else if (s.timeLeft <= 0) r = { winnerTeam: null, reason: 'timeout' };
    } else {
      const foes = s.players.filter(p => !humanTeams.has(p.team));
      const foeTeam = foes.length ? foes[0].team : null, myTeam = humans.length ? humans[0].team : null;
      if (!humansAlive) r = { winnerTeam: foeTeam, reason: 'eliminated' };
      else if (goal.type === 'eliminate' && foes.every(p => p.state === 'dead')) r = { winnerTeam: myTeam, reason: 'clear' };
      else if (goal.type === 'boxes' && s.targetsTotal > 0 && s.targets.size === 0) r = { winnerTeam: myTeam, reason: 'boxes' };
      else if (s.timeLeft <= 0) r = goal.type === 'survive' ? { winnerTeam: myTeam, reason: 'survived' } : { winnerTeam: foeTeam, reason: 'timeout' };
    }
    if (r) {
      r.win = r.winnerTeam != null && humanTeams.has(r.winnerTeam);
      r.draw = r.winnerTeam == null && !r.loserHumans;
      r.time = s.time; s.result = r;
      emit(s, 'end', { win: r.win, reason: r.reason });
    }
    return s.result;
  }
  // 闯关评星：通关 1 星 + 剩余时间达标 1 星 + 受困次数达标 1 星（生存关以受困次数为主）
  function rateStars(stage, s) {
    if (!s.result || !s.result.win) return 0;
    const traps = s.players.filter(p => p.human).reduce((n, p) => n + p.traps, 0);
    const st = stage.stars || { time: 0.4, traps: 0 };
    if (stage.goal && stage.goal.type === 'survive') return traps <= st.traps ? 3 : traps <= st.traps + 2 ? 2 : 1;
    return 1 + (s.timeLeft / s.timeLimit >= st.time ? 1 : 0) + (traps <= st.traps ? 1 : 0);
  }

  // —— 机关：传送带 / 冰面 / 传送门 ——
  function applyTiles(s, p, it, dt) {
    // 冰面：松开方向后沿最后方向继续滑行，直到撞上障碍；滑出冰面后停在格子中心
    let dir = it.dir, sliding = false, limit = Infinity;
    const cx = Math.round(p.x), cy = Math.round(p.y);
    const here = tileAt(s, cx, cy);
    if (!dir && p.slideDir) {
      if (here && here.type === 'ice') { dir = p.slideDir; sliding = true; }
      else {
        const [dx, dy] = DIRS[p.slideDir], main = dx ? 'x' : 'y', sgn = dx || dy;
        const rel = (p[main] - Math.round(p[main])) * sgn;
        if (rel < -1e-4) { dir = p.slideDir; sliding = true; limit = -rel; } else p.slideDir = null;
      }
    }
    return { dir, sliding, limit };
  }
  function afterMove(s, p, dir, moved, sliding, dt) {
    const cx = Math.round(p.x), cy = Math.round(p.y);
    let t = tileAt(s, cx, cy);
    // 冰面方向记录
    if (dir) {
      if (t && t.type === 'ice') p.slideDir = dir;
      else if (!sliding) p.slideDir = null;
      if (sliding && moved <= 1e-6) p.slideDir = null;
    }
    p.sliding = sliding && moved > 1e-6;
    // 传送带：推动站在上面的角色
    if (t && t.type === 'belt') {
      const keep = p.dir;
      const m = movePlayer(s, p, t.dir, CONFIG.tiles.beltSpeed * dt, true);
      p.dir = keep; if (m > 0) p.moving = p.moving || false;
    }
    // 传送门：走到传送门中心时传送到配对的另一端
    const k = idx(s, Math.round(p.x), Math.round(p.y));
    if (p.portalLock >= 0 && p.portalLock !== k) p.portalLock = -1;
    t = s.tiles[k];
    if (t && t.type === 'portal' && p.portalLock !== k &&
        Math.abs(p.x - Math.round(p.x)) < CONFIG.tiles.portalNear && Math.abs(p.y - Math.round(p.y)) < CONFIG.tiles.portalNear) {
      const dest = s.portalPair.get(k);
      if (dest != null) {
        const dx = dest % s.cols, dy = (dest / s.cols) | 0;
        if (!bubbleAt(s, dx, dy) && s.grid[dest] === EMPTY) {
          emit(s, 'teleport', { id: p.id, x: Math.round(p.x), y: Math.round(p.y), tx: dx, ty: dy });
          p.x = dx; p.y = dy; p.px = dx; p.py = dy; p.portalLock = dest; p.slideDir = null;
        }
      }
    }
  }

  // —— 单步推进 ——
  function step(s, intents, dt) {
    if (s.result) return;
    for (const p of s.players) { p.px = p.x; p.py = p.y; }
    if (s.phase === 'countdown') {
      const before = Math.ceil(s.countdown);
      s.countdown -= dt;
      const after = Math.ceil(s.countdown);
      if (s.countdown <= 0) { s.phase = 'play'; emit(s, 'go', {}); }
      else if (after !== before) emit(s, 'countdown', { n: after });
      return;
    }
    s.time += dt;
    const beforeSec = Math.ceil(s.timeLeft);
    s.timeLeft = Math.max(0, s.timeLeft - dt);
    const afterSec = Math.ceil(s.timeLeft);
    if (afterSec !== beforeSec && afterSec > 0 && afterSec <= CONFIG.match.lastBeeps) emit(s, 'tick', { n: afterSec });

    // 1) 玩家意图
    s.players.forEach((p, i) => {
      if (p.state === 'dead') return;
      const it = intents[i] || NO_INTENT;
      if (p.state === 'trapped') {
        if (it.rescue && p.lollipop > 0) { p.lollipop--; rescuePlayer(s, p, 'self', p.id); }
        return;
      }
      p.aliveTime += dt;
      if (p.invuln > 0) p.invuln = Math.max(0, p.invuln - dt);
      if (p.curse) { p.curse.t -= dt; if (p.curse.t <= 0) { p.curse = null; emit(s, 'curseEnd', { id: p.id }); } }
      let raw = it.dir;
      if (raw && p.curse && p.curse.type === 'reverse') raw = OPP[raw];
      const tl = applyTiles(s, p, { dir: raw }, dt);
      const dir = tl.dir;
      let moved = 0;
      if (dir) {
        const sp = speedOf(p);
        moved = movePlayer(s, p, dir, Math.min(sp * dt, tl.limit));
        p.moving = moved > 1e-6;
        if (p.moving && !tl.sliding) p.walk += dt * sp * 3.2;
      } else p.moving = false;
      afterMove(s, p, dir, moved, tl.sliding, dt);
      if (it.bomb || (p.curse && p.curse.type === 'auto')) placeBubble(s, p);
    });

    // 2) 泡泡倒计时、滑动（推动 / 传送带）
    for (const b of s.bubbles) {
      b.t -= dt;
      if (!b.slide) {
        const t = tileAt(s, b.x, b.y);
        if (t && t.type === 'belt') {
          const [dx, dy] = DIRS[t.dir];
          if (canSlideInto(s, b.x + dx, b.y + dy)) b.slide = { dx, dy, prog: 0, speed: CONFIG.tiles.beltSpeed, once: true };
        }
      }
      if (b.slide) {
        b.slide.prog += dt * (b.slide.speed || CONFIG.bubble.pushSpeed);
        while (b.slide && b.slide.prog >= 1) {
          b.x += b.slide.dx; b.y += b.slide.dy; b.slide.prog -= 1;
          if (b.slide.once || !canSlideInto(s, b.x + b.slide.dx, b.y + b.slide.dy)) b.slide = null;
        }
      }
    }
    for (let guard = 0; guard < 64; guard++) {
      const b = s.bubbles.find(q => q.t <= 0);
      if (!b) break;
      explode(s, b);
    }

    // 3) 水柱衰减
    for (const f of s.flames) f.t -= dt;
    s.flames = s.flames.filter(f => f.t > 0);
    for (let k = 0; k < s.flameGrid.length; k++) if (s.flameGrid[k] > 0) s.flameGrid[k] = Math.max(0, s.flameGrid[k] - dt);

    // 4) 被波及 → 困住
    for (const p of s.players) {
      if (p.state !== 'alive' || p.invuln > 0) continue;
      const cx = Math.round(p.x), cy = Math.round(p.y);
      if (!inB(s, cx, cy)) continue;
      const k = idx(s, cx, cy);
      if (s.flameGrid[k] > 0) trapPlayer(s, p, s.flameOwner[k]);
    }

    // 5) 被困者：碰触 / 自救 / 超时
    const R = CONFIG.trap.touchDist;
    for (const t of s.players) {
      if (t.state !== 'trapped') continue;
      t.trapT -= dt;
      const touching = s.players.filter(o => o !== t && o.state === 'alive' && Math.abs(o.x - t.x) < R && Math.abs(o.y - t.y) < R);
      const enemy = touching.find(o => o.team !== t.team);
      const mate = touching.find(o => o.team === t.team);
      if (enemy) eliminatePlayer(s, t, enemy.id, 'touch');
      else if (mate) rescuePlayer(s, t, 'mate', mate.id);
      else if (t.trapT <= 0) eliminatePlayer(s, t, t.trappedBy, 'timeout');
    }

    // 6) 拾取道具
    for (const p of s.players) {
      if (p.state !== 'alive') continue;
      const cx = Math.round(p.x), cy = Math.round(p.y);
      if (!inB(s, cx, cy)) continue;
      const k = idx(s, cx, cy);
      if (s.items[k]) { const it = s.items[k]; s.items[k] = null; applyItem(s, p, it); }
    }

    // 7) 限时缩圈
    updateShrink(s);

    checkOutcome(s);
  }

  return { EMPTY, WALL, BOX, DIRS, DIR_KEYS, OPP, NO_INTENT, rng, inB, idx, tileAt,
    generateMap, spawnSafeCells, spawnsOf, createState, createEmptyState, makePlayer, makeShrink,
    bubbleAt, countOwned, speedOf, isBlockedFor, movePlayer, placeBubble, startPush, canSlideInto,
    spreadFrom, getBlastCells, getDangerMap, explode, dropWall, updateShrink, upcomingDrops,
    trapPlayer, rescuePlayer, eliminatePlayer, applyItem, checkOutcome, rateStars, step };
})();

/* =====================================================================
   4. Layout：纯函数，按视口计算地图与“操控区”数组
   opt: { btnSize, lefty, players: 1|2, cols, rows }
   双人：横屏左栏 P1 / 右栏 P2；竖屏下方操控区左右平分。zone.region 为该玩家触摸独占区
   ===================================================================== */
const Layout = (() => {
  function compute(vw, vh, safeIn, opt = {}) {
    const C = CONFIG.layout, cols = opt.cols || CONFIG.cols, rows = opt.rows || CONFIG.rows, g = C.gap;
    const safe = { top: Math.max(safeIn.top || 0, C.safeTopMin), bottom: Math.max(safeIn.bottom || 0, C.safeBottomMin),
      left: safeIn.left || 0, right: safeIn.right || 0 };
    const size = C.btn[opt.btnSize] || C.btn.M, lefty = !!opt.lefty, duo = opt.players === 2;
    const bottomLimit = vh - Math.max(safe.bottom, C.noButtonBottom);       // 底部 30pt 内不放按钮
    const side = Math.max(C.sideMin, Math.min(C.sideMax, Math.round(vw * 0.145)));
    const awL = vw - safe.left - safe.right - side * 2 - g * 2;
    const ahL = vh - safe.top - safe.bottom - g * 2;
    const cellL = Math.floor(Math.min(awL / cols, ahL / rows, C.maxCell));
    const landscape = vw >= vh && cellL >= C.minLandscapeCell;               // 窗口变窄（分屏/台前调度）→ 竖屏布局
    const L = { vw, vh, safe, portrait: !landscape, bottomLimit, zones: [], hud: {}, duo, cols, rows };
    const br = size.bomb / 2, rr = size.rescue / 2;

    if (landscape) {
      const cell = cellL, mw = cell * cols, mh = cell * rows;
      const mx = Math.round(safe.left + side + g + (awL - mw) / 2);
      const my = Math.round(safe.top + g + (ahL - mh) / 2);
      L.cell = cell; L.map = { x: mx, y: my, w: mw, h: mh };
      const colA = { x: safe.left + 8, w: mx - g - (safe.left + 8) };
      const colB = { x: mx + mw + g, w: vw - safe.right - 8 - (mx + mw + g) };
      const top = safe.top + g;
      if (!duo) {

/* —— Controller 统一接口：getIntent(gameState, playerId) → { dir, bomb, rescue } —— */
class TouchController {
  constructor(input, slot) { this.input = input; this.slot = slot; }
  getIntent() {
    const z = this.input.st.touch[this.slot]; if (!z) return Logic.NO_INTENT;
    const r = { dir: z.dir, bomb: z.bombQ > 0, rescue: z.rescueQ > 0 };
    z.bombQ = 0; z.rescueQ = 0; return r;
  }
}
class KeyboardController {
  constructor(input, scheme) { this.input = input; this.scheme = scheme || null; }
  getIntent() {
    const st = this.input.st;
    if (!this.scheme) { const r = { dir: this.input.keyDir(), bomb: st.bombQ > 0, rescue: st.rescueQ > 0 }; st.bombQ = 0; st.rescueQ = 0; return r; }
    const kb = st.kb[this.scheme];
    const r = { dir: this.input.keyDir(this.scheme), bomb: kb.bombQ > 0, rescue: kb.rescueQ > 0 };
    kb.bombQ = 0; kb.rescueQ = 0; return r;
  }
}

  constructor(input, slot) { this.input = input; this.slot = slot; }
  getIntent() {
    const p = this.input.st.pads[this.slot]; if (!p || !p.connected) return Logic.NO_INTENT;
    const r = { dir: p.dir, bomb: p.aQ > 0, rescue: p.bQ > 0 };
    p.aQ = 0; p.bQ = 0; return r;
  }
}
class MergeController {                      // 一名玩家同时接受触控 + 键盘 + 手柄
  constructor(list) { this.list = list; }
  getIntent(gs, id) {
    const r = { dir: null, bomb: false, rescue: false };
    for (const c of this.list) { const i = c.getIntent(gs, id); r.dir = r.dir || i.dir; r.bomb = r.bomb || i.bomb; r.rescue = r.rescue || i.rescue; }

}

})();

/* =====================================================================
   9. Store：localStorage 存档（try/catch 包裹）
   ===================================================================== */
const Store = {
  data: { settings: { lefty: false, btnSize: 'M', joyFixed: false, mute: false, defaultDiff: 'normal', mapSize: 'std' },
    best: { score: 0, kills: 0, time: 0 }, tutorialSeen: false, stages: STAGES.map(() => 0) },
  load() {
    try {
      const raw = localStorage.getItem(CONFIG.storeKey);
      if (raw) {
        const d = JSON.parse(raw);
        Object.assign(this.data.settings, d.settings || {}); Object.assign(this.data.best, d.best || {});
        this.data.tutorialSeen = !!d.tutorialSeen;
        if (Array.isArray(d.stages)) d.stages.forEach((v, i) => { if (i < this.data.stages.length) this.data.stages[i] = v | 0; });
      }
    } catch (_) {}
  },
  save() { try { localStorage.setItem(CONFIG.storeKey, JSON.stringify(this.data)); } catch (_) {} },
  stageUnlocked(i) { return i === 0 || this.data.stages[i - 1] > 0; },
};

/* =====================================================================
   11. Game：主循环（固定步长 60Hz 逻辑 + rAF 渲染）与对局组装
   ===================================================================== */
const Game = (() => {
  const FIXED = CONFIG.fixedDt;
  let state = null, running = false, paused = false, acc = 0, last = 0, L = null, lastPortrait = null;
  let inGame = false, resultPending = false, banner = '';
  let lastCfg = { mode: 'practice', sub: 'ffa', diff: 'normal', mapSize: 'std', stage: 0, chars: ['bunny', 'bear'] };
  const menuCv = document.getElementById('menuChars'), menuCtx = menuCv.getContext('2d');

  function readSafe() {
    const cs = getComputedStyle(document.getElementById('safeProbe'));
    return { top: parseFloat(cs.paddingTop) || 0, right: parseFloat(cs.paddingRight) || 0, bottom: parseFloat(cs.paddingBottom) || 0, left: parseFloat(cs.paddingLeft) || 0 };
  }
  const humanCount = () => state ? state.players.filter(p => p.human).length : 1;
  function relayout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    L = Layout.compute(vw, vh, readSafe(), Object.assign({}, Store.data.settings,
      { players: humanCount(), cols: state ? state.cols : CONFIG.cols, rows: state ? state.rows : CONFIG.rows }));
    Renderer.resize(vw, vh, L); UI.placePause(L);
    if (lastPortrait !== null && lastPortrait !== L.portrait) pause('rotate');   // 旋转自动暂停
    lastPortrait = L.portrait;
  }
  // —— 根据模式组装地图与 players（最多 4 人）——
  function buildMatch(cfg, seed) {
    const nh = cfg.mode === 'duo' ? 2 : 1;
    const ctrl = slot => new MergeController([new TouchController(Input, slot),
      new KeyboardController(Input, nh === 2 ? (slot ? 'p2' : 'p1') : null), new GamepadController(Input, slot)]);
    const chars = (cfg.chars || ['bunny', 'bear']).slice(0, nh);
    const rest = THEME.charKeys.filter(k => !chars.includes(k)); let ri = 0;
    const nextChar = () => rest[ri++ % rest.length];
    const human = (slot, team, spawn) => ({ id: slot + 1, team, spawn, charKey: chars[slot], human: true, slot,
      label: nh === 2 ? THEME.slots[slot].name : '你', color: THEME.slots[slot].main, controller: ctrl(slot) });
    let nid = 3;
    const diff = CONFIG.ai.diff[cfg.diff] ? cfg.diff : 'normal';
    const ai = (team, spawn, d = diff) => { const id = nid++; return { id, team, spawn, charKey: nextChar(), ai: d,
      label: 'AI·' + CONFIG.ai.diff[d].name, controller: new AIController(seed + id * 7919, d) }; };
    const arena = CONFIG.maps.find(m => m.id === (cfg.mapSize === 'large' ? 'arenaL' : 'arena'));
    const m = { mode: cfg.mode, map: arena, goal: { type: 'lastTeam' }, time: CONFIG.match.battleTime, teamMode: false, players: [], banner: '' };
    if (cfg.mode === 'practice') {
      m.map = CONFIG.maps[0]; m.goal = { type: 'eliminate' }; m.time = CONFIG.match.practiceTime; m.banner = '练习场：淘汰全部木头人';
      m.players = [human(0, 1, 0), ...[1, 2, 3].map(i => ({ id: i + 1, team: 2, spawn: i, charKey: nextChar(), gray: true, label: '木头人', controller: new DummyController(seed + i) }))];
    } else if (cfg.mode === 'battle') {
      if (cfg.sub === '2v2') { m.teamMode = true; m.players = [human(0, 1, 0), ai(1, 3), ai(2, 1), ai(2, 2)]; m.banner = '2v2：和 AI 队友并肩作战'; }
      else { m.players = [human(0, 1, 0), ai(2, 1), ai(3, 2), ai(4, 3)]; m.banner = '个人混战：活到最后！'; }
    } else if (cfg.mode === 'duo') {
      if (cfg.sub === '1v1') { m.players = [human(0, 1, 0), human(1, 2, 1)]; m.banner = 'P1 vs P2'; }
      else if (cfg.sub === 'duo2v2') { m.teamMode = true; m.players = [human(0, 1, 0), ai(1, 3), human(1, 2, 1), ai(2, 2)]; m.banner = '各带一个 AI 队友'; }
      else { m.teamMode = true; m.players = [human(0, 1, 0), human(1, 1, 3), ai(2, 1), ai(2, 2)]; m.banner = '合作：一起打败 AI'; }

      for (const z of L.zones) {
        const rects = { 泡泡键: box(z.bomb), 自救键: box(z.rescue), 暂停键: L.pause, 摇杆区: z.move };
        for (const [n, r] of Object.entries(rects)) {
          if (inter(r, M)) fail(n + '与地图重叠');
          if (r.x < L.safe.left || r.y < L.safe.top || r.x + r.w > vw - L.safe.right || r.y + r.h > sb + 0.5) fail(n + '进入安全区');
        }
        if (inter(box(z.bomb), box(z.rescue))) fail('按钮互相重叠');
        if (inter(box(z.bomb), z.move) || inter(box(z.rescue), z.move)) fail('按钮与摇杆区重叠');
        if (z.bomb.r * 2 < 90 || z.rescue.r * 2 < 64 || L.pause.w < 44) fail('按钮尺寸不足');
        if (z.region) { for (const r of [box(z.bomb), box(z.rescue), z.move]) if (!inside(r, z.region)) fail(`P${z.slot + 1} 控件超出自己的分区`); }
      }
      for (const k of ['timer', 'foes', 'stats']) if (inter(L.hud[k], M)) fail('HUD 与地图重叠');
      for (const e of L.hud.slots) if (inter(e.rect, M)) fail('属性卡与地图重叠');
    };
    guard('布局', () => {
      for (const [vw, vh, wantPortrait] of views) {
        let pass = true, why = '', cell = 0;
        for (const btnSize of ['S', 'M', 'L']) for (const lefty of [false, true]) {
          const L = Layout.compute(vw, vh, safe, { btnSize, lefty }); cell = L.cell;
          checkLayout(L, vw, vh, wantPortrait, m => { if (pass) why = `${btnSize}${lefty ? '/左手' : ''}: ${m}`; pass = false; });
        }
        ok(`布局：${vw}×${vh}（${wantPortrait ? '竖屏' : '横屏'}）`, pass, pass ? `格子 ${cell}pt` : why);
      }
    });

    /* ================= 第二轮新增自测 ================= */
    // —— 双人布局（含 19×13 大地图）——
    guard('双人布局', () => {
      for (const [vw, vh, wantPortrait] of views) {
        let pass = true, why = '', cell = 0;
        for (const btnSize of ['S', 'M', 'L']) for (const cols of [15, 19]) {
          if (cols === 19 && wantPortrait) continue;
          const L = Layout.compute(vw, vh, safe, { btnSize, players: 2, cols }); cell = L.cell;
          const fail = m => { if (pass) why = `${btnSize}/${cols}列: ${m}`; pass = false; };
          checkLayout(L, vw, vh, wantPortrait, fail);
          if (L.zones.length !== 2 || inter(L.zones[0].region, L.zones[1].region)) fail('两人分区重叠');
          if (!wantPortrait && !(L.zones[0].region.x < L.map.x && L.zones[1].region.x > L.map.x)) fail('横屏应左栏 P1、右栏 P2');
        }
        ok(`双人布局：${vw}×${vh}`, pass, pass ? `格子 ${cell}pt` : why);
      }
    });
    // —— 双人触控分区 ——
    guard('触控分区', () => {
      for (const [vw, vh] of [[1194, 834], [834, 1194]]) {
        const L = Layout.compute(vw, vh, safe, { players: 2 }), S = Input.simulate, st = Input.st;
        const [z0, z1] = L.zones, c0 = { x: z0.move.x + z0.move.w / 2, y: z0.move.y + z0.move.h / 2 }, c1 = { x: z1.move.x + z1.move.w / 2, y: z1.move.y + z1.move.h / 2 };
        S.begin(L, { joyFixed: false });
        S.ev('down', 11, c0.x, c0.y); S.ev('move', 11, c0.x + 40, c0.y);
        S.ev('down', 22, c1.x, c1.y); S.ev('move', 22, c1.x, c1.y + 40);
        const a = st.touch[0].dir === 'right' && st.touch[1].dir === 'down';
        S.ev('move', 11, c0.x - 40, c0.y);
        const b = st.touch[0].dir === 'left' && st.touch[1].dir === 'down';
        S.ev('move', 11, c1.x + 30, c0.y);                       // P1 手指拖进 P2 栏：仍归 P1
        const c = st.touch[0].dir === 'right' && st.touch[1].dir === 'down' && st.touch[1].joy.id === 22;
        S.ev('down', 33, z1.bomb.x, z1.bomb.y);
        const d = st.touch[1].bombQ === 1 && st.touch[0].bombQ === 0;
        S.ev('down', 44, L.map.x + L.map.w / 2, L.map.y + L.map.h / 2);  // 点地图：不属于任何人
        const e = !st.pointers.has(44);
        S.ev('down', 55, c0.x, c0.y + 10);                       // P1 栏第二根手指：不抢摇杆
        const f = st.touch[0].joy.id === 11;
        S.ev('up', 22);
        const g = !st.touch[1].joy.active && st.touch[1].dir === null && st.touch[0].joy.active;
        S.end();
        ok(`双人触控：${vw}×${vh} 两个 pointerId 互不干扰`, a && b && c && d && e && f && g, [a, b, c, d, e, f, g].map(v => v ? '✓' : '✗').join(''));
      }
    });
    // —— 外设 ——
    guard('外设', () => {
      const pad = Input.st.pads[0], keep = Object.assign({}, pad);
      Object.assign(pad, { connected: true, dir: 'left', aQ: 1, bQ: 0 });
      const gc = new GamepadController(Input, 0), i1 = gc.getIntent(), i2 = gc.getIntent();
      Object.assign(pad, keep);
      ok('手柄：摇杆方向 + A 放泡泡（单次触发）', i1.dir === 'left' && i1.bomb && !i1.rescue && !i2.bomb);
      const kb = Input.st.kb.p2, keepK = kb.keys.slice(); kb.keys = ['up']; kb.bombQ = 1;
      const k = new KeyboardController(Input, 'p2').getIntent(); kb.keys = keepK;
      ok('键盘双人：P2 方向键 + 回车', k.dir === 'up' && k.bomb && Input.SCHEMES.p2.bomb.includes('Enter') && Input.SCHEMES.p2.rescue.includes('ShiftRight'));
    });
    // —— AI 不自杀：200 张随机地图 ——
    guard('AI 安全', () => {
      let fails = 0, placed = 0, info = '';
      const diffs = ['easy', 'normal', 'hard'];
      for (let i = 0; i < 200; i++) {
        const R = Logic.rng(1000 + i);
        const map = CONFIG.maps[i % 4 === 3 ? 2 : 1];
        const s = Logic.createState({ map, seed: 5000 + i, mode: 'sandbox', players: [] });
        s.phase = 'play'; s.hidden.fill(null);
        const empties = []; for (let k = 0; k < s.grid.length; k++) if (s.grid[k] === EMPTY) empties.push(k);
        const k = empties[(R() * empties.length) | 0];
        const p = Logic.makePlayer({ id: 1, team: 1 }, k % s.cols, (k / s.cols) | 0);
        p.stats.power = 1 + ((R() * 6) | 0); p.stats.speed = (R() * 7) | 0; p.stats.bubbles = 1 + ((R() * 3) | 0);
        s.players.push(p);
        const ai = new AIController(77 + i, diffs[i % 3]);
        if (!ai.tryBombHere(s, p)) continue;                   // 无逃生路线 → 不放（也算安全）
        placed++;
        for (let f = 0; f < 60 * 5; f++) {
          Logic.step(s, [ai.getIntent(s, p.id)], 1 / 60);
          if (p.state !== 'alive') { fails++; if (!info) info = `#${i} ${diffs[i % 3]} 威力${p.stats.power} 速度${p.stats.speed}`; break; }
          if (f > 200 && !s.bubbles.length && !s.flames.length) break;
        }
      }
      ok('AI：200 张随机地图放泡泡后都能逃到安全格', fails === 0 && placed >= 100, `放置 ${placed} 次，失败 ${fails}${info ? ' · ' + info : ''}`);
    });
    // —— AI 救援队友 ——
    guard('AI 救援', () => {
      let okAll = true, info = '';
      for (const d of ['easy', 'normal', 'hard']) {
        const s = mk(['...........', '.#.#.#.#.#.', '...........', '.#.#.#.#.#.', '...........']);
        const A = Logic.makePlayer({ id: 1, team: 1 }, 1, 2), B = Logic.makePlayer({ id: 2, team: 1 }, 6, 2);
        s.players.push(A, B);
        const ca = new AIController(3, d), cb = new AIController(4, d);
        Logic.trapPlayer(s, A, 9);
        let t = 0;
        for (let f = 0; f < 60 * CONFIG.trap.time && A.state === 'trapped'; f++) { Logic.step(s, [ca.getIntent(s, 1), cb.getIntent(s, 2)], 1 / 60); t = f / 60; }
        if (!(A.state === 'alive' && B.rescues === 1)) { okAll = false; info = `${d} 失败`; }
        else info += `${CONFIG.ai.diff[d].name} ${t.toFixed(1)}s `;
      }
      ok('AI：队友被困时会在限定时间内赶去救援', okAll, info);
    });
    // —— AI 放泡泡冷却 ——
    guard('AI 冷却', () => {
      const s = mk(['.........', '.........', '.........']);
      const p = Logic.makePlayer({ id: 1, team: 1 }, 4, 1); p.stats.bubbles = 5; s.players.push(p);
      const ai = new AIController(1, 'hard');
      const a = ai.tryBombHere(s, p); Logic.step(s, [ai.getIntent(s, 1)], 1 / 60);
      const b = ai.canBomb(s, p, true);
      ok('AI：放泡泡后 0.3 秒内不会再放', a && !b && CONFIG.ai.bombCooldown >= 0.3);
    });
    // —— 机关 ——
    guard('机关', () => {
      // 传送门
      let s = mk(['.......', '.......', '.......']);
      const k1 = 1 * 7 + 1, k2 = 1 * 7 + 5;
      s.tiles[k1] = { type: 'portal', id: 0 }; s.tiles[k2] = { type: 'portal', id: 0 }; s.portalPair.set(k1, k2); s.portalPair.set(k2, k1);
      let p = Logic.makePlayer({ id: 1, team: 1 }, 0, 1); s.players.push(p);
      let tele = 0;
      for (let f = 0; f < 30; f++) { Logic.step(s, [{ dir: 'right' }], 1 / 60); tele += s.events.filter(e => e.type === 'teleport').length; s.events.length = 0; }
      ok('传送门：走进去从配对的另一端出来（不来回弹）', p.x >= 5 && tele === 1, `x=${p.x.toFixed(2)} 传送 ${tele} 次`);
      let paired = true;
      for (const m of CONFIG.maps.filter(m => m.features && m.features.portals && m.features.portals.length)) {
        const g = Logic.generateMap(m, 3);
        for (let k = 0; k < g.tiles.length; k++) if (g.tiles[k] && g.tiles[k].type === 'portal') {
          const o = g.portalPair.get(k); if (o == null || o === k || g.portalPair.get(o) !== k || g.tiles[o].type !== 'portal') paired = false;
        }
      }
      ok('传送门：关卡里的传送门全部成对', paired);
      // 冰面
      s = mk(['.......#']); for (let x = 1; x <= 6; x++) s.tiles[x] = { type: 'ice' };
      p = Logic.makePlayer({ id: 1, team: 1 }, 0, 0); s.players.push(p);
      for (let f = 0; f < 24; f++) Logic.step(s, [{ dir: 'right' }], 1 / 60);
      const released = p.x;
      for (let f = 0; f < 180; f++) Logic.step(s, [], 1 / 60);
      ok('冰面：松开方向后滑行，停在障碍前', released < 3 && p.x === 6 && !p.slideDir, `松手 x=${released.toFixed(2)} → 停在 ${p.x}`);
      // 传送带
      s = mk(['......']); for (let x = 1; x <= 4; x++) s.tiles[x] = { type: 'belt', dir: 'right' };
      p = Logic.makePlayer({ id: 1, team: 1 }, 1, 0); s.players.push(p);
      const bb = addB(s, 2, 0, 1, 9);
      for (let f = 0; f < 60; f++) Logic.step(s, [], 1 / 60);
      ok('传送带：推动角色和泡泡', p.x > 1.5 && bb.x > 2, `角色 x=${p.x.toFixed(2)} 泡泡 x=${bb.x}`);
      // 缩圈
      s = mk(['.........', '.........', '.........', '.........', '.........', '.........', '.........']);
      s.shrink = Logic.makeShrink(s); s.timeLeft = CONFIG.shrink.start + 0.01;
      const k0 = s.shrink.order[0];
      p = Logic.makePlayer({ id: 1, team: 1 }, k0 % 9, (k0 / 9) | 0); s.players.push(p);
      Logic.step(s, [], 1 / 60);
      const crushed = p.state === 'dead' && s.grid[k0] === WALL;
      const C = CONFIG.shrink, kx0 = Math.floor((9 - C.keepW) / 2), ky0 = Math.floor((7 - C.keepH) / 2);
      const keepOk = s.shrink.order.every(k => { const x = k % 9, y = (k / 9) | 0; return !(x >= kx0 && x < kx0 + C.keepW && y >= ky0 && y < ky0 + C.keepH); });
      s.timeLeft = C.end; Logic.updateShrink(s);
      ok('缩圈：墙块落下淘汰站在上面的角色，中央保留', crushed && keepOk && s.shrink.i === s.shrink.order.length);
      // 草丛
      s = mk(['.......']); s.tiles[5] = { type: 'grass' };
      const me = Logic.makePlayer({ id: 1, team: 1 }, 1, 0), foe = Logic.makePlayer({ id: 2, team: 2 }, 5, 0);
      const hid = !AI.visible(s, me, foe); me.x = 4; const seen = AI.visible(s, me, foe);
      ok('草丛：藏在草里的角色对 AI 不可见（贴身除外）', hid && seen);
    });
    // —— 12 关 ——
    guard('闯关', () => {
      const stages = CONFIG.maps.filter(m => m.stage);
      let pass = stages.length === 12, why = stages.length !== 12 ? `只有 ${stages.length} 关` : '';
      const fail = m => { if (pass) why = m; pass = false; };
      for (const st of stages) for (let seed = 1; seed <= 4; seed++) {
        const g = Logic.generateMap(st, seed), cols = g.cols, rows = g.rows;
        for (const [sx, sy] of g.spawns) for (const [x, y] of Logic.spawnSafeCells(cols, rows, sx, sy, st.spawnClear)) {
          const k = y * cols + x; if (g.grid[k] !== EMPTY) fail(`第${st.no}关 出生点不安全`); if (g.tiles[k] && g.tiles[k].type !== 'grass') fail(`第${st.no}关 出生点有机关`);
        }
        if (g.boxCount < 1 || g.boxCount > st.boxCount.max) fail(`第${st.no}关 箱子数量`);
        if (st.enemies.length < 1 || st.enemies.length > 3) fail(`第${st.no}关 敌人数量`);
        // 可达性：墙以外的格子（箱子可炸开），传送门相连
        const seen = new Uint8Array(cols * rows), q = [g.spawns[0][1] * cols + g.spawns[0][0]]; seen[q[0]] = 1;
        while (q.length) { const u = q.shift(), ux = u % cols, uy = (u / cols) | 0;
          const nb = [[ux + 1, uy], [ux - 1, uy], [ux, uy + 1], [ux, uy - 1]].filter(([x, y]) => x >= 0 && y >= 0 && x < cols && y < rows).map(([x, y]) => y * cols + x);
          if (g.portalPair.has(u)) nb.push(g.portalPair.get(u));
          for (const v of nb) if (!seen[v] && g.grid[v] !== WALL) { seen[v] = 1; q.push(v); } }
        const type = st.goal.type;
        if (type === 'eliminate' || type === 'survive') for (let i = 1; i <= st.enemies.length; i++) { const [x, y] = g.spawns[i]; if (!seen[y * cols + x]) fail(`第${st.no}关 敌人不可达`); }
        if (type === 'boxes') { if (g.targets.size !== st.targets) fail(`第${st.no}关 目标箱数量`); for (const k of g.targets) if (!seen[k] || g.grid[k] !== BOX) fail(`第${st.no}关 目标箱不可达`); }
        if (!(st.time > 0) || (st.shrink && st.time < CONFIG.shrink.start)) fail(`第${st.no}关 时间配置`);
      }
      ok('闯关：12 关地图生成正常、出生点安全、目标可达成', pass, why || '每关 4 个种子');
      // 每关跑 8 秒 AI 对局，确认运行不报错
      let runOk = true, info = '';
      for (const st of stages) {
        try {
          const s = Logic.createState({ map: st, seed: st.no * 31, mode: 'stage', goal: st.goal, players: [
            { id: 1, team: 1, spawn: 0, charKey: 'bunny', human: true, controller: new AIController(1, 'hard') },
            ...st.enemies.map((d, i) => ({ id: i + 2, team: 2, spawn: i + 1, charKey: THEME.charKeys[i + 1], controller: new AIController(i + 9, d) }))] });
          if (st.shrink) s.timeLeft = Math.min(s.timeLeft, CONFIG.shrink.start + 2);
          for (let f = 0; f < 60 * 8 && !s.result; f++) { Logic.step(s, s.players.map(p => p.controller.getIntent(s, p.id)), 1 / 60); s.events.length = 0; }
        } catch (e) { runOk = false; info = `第${st.no}关：${e.message}`; break; }
      }
      ok('闯关：12 关 AI 对局运行无异常', runOk, info);
    });
    // —— 胜负与评星 ——
    guard('胜负', () => {
      const s = mk(['.....']); s.mode = 'battle'; s.goal = { type: 'lastTeam' }; s.timeLeft = 100; s.timeLimit = 180;
      const a = Logic.makePlayer({ id: 1, team: 1, human: true }, 0, 0), b = Logic.makePlayer({ id: 2, team: 2 }, 4, 0);
      s.players.push(a, b); Logic.eliminatePlayer(s, b, 1); Logic.checkOutcome(s);
      ok('胜负：最后存活的一方获胜', s.result && s.result.win && s.result.winnerTeam === 1);
      const st = CONFIG.maps.find(m => m.id === 'stage1');
      const s2 = { result: { win: true }, players: [{ human: true, traps: 0 }], timeLeft: 100, timeLimit: 150 };
      const s3 = { result: { win: true }, players: [{ human: true, traps: 2 }], timeLeft: 10, timeLimit: 150 };
      ok('评星：按剩余时间和受困次数 1–3 星', Logic.rateStars(st, s2) === 3 && Logic.rateStars(st, s3) === 1 && Logic.rateStars(st, { result: { win: false } }) === 0);
    });

    const pass = res.filter(r => r.pass).length;
    console.table(res);
    return { pass, total: res.length, res };
  }
  return { run };
})();

/* =====================================================================
   13. PWA：Canvas 生成图标、data URL manifest、注册 sw.js、禁用 iOS 默认手势
   ===================================================================== */
(function pwa() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
    const bg = g.createLinearGradient(0, 0, 512, 512); bg.addColorStop(0, '#ffd1e3'); bg.addColorStop(1, '#c6f4ea');
    g.fillStyle = bg; g.fillRect(0, 0, 512, 512);
    g.fillStyle = 'rgba(255,255,255,.6)'; for (let i = 0; i < 9; i++) { g.beginPath(); g.arc(60 + (i % 3) * 196, 60 + ((i / 3) | 0) * 196, 16, 0, 7); g.fill(); }
    g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.arc(256, 270, 200, 0, 7); g.fill();
    g.strokeStyle = '#ff9ec7'; g.lineWidth = 14; g.stroke();
    Renderer.drawCharacter(g, 'bunny', 256, 280, 330, { dir: 'down', outline: true });
    const url = c.toDataURL('image/png');
    document.getElementById('touchIcon').href = url;
    const start = location.href.split('?')[0].split('#')[0];
    const manifest = { name: '奶油泡泡大作战', short_name: '奶油泡泡', start_url: start, scope: start.replace(/[^/]*$/, ''),
      display: 'standalone', orientation: 'any', background_color: '#ffe4ee', theme_color: '#ffc2d6',
      icons: [{ src: url, sizes: '512x512', type: 'image/png', purpose: 'any' }] };
    const link = document.createElement('link'); link.rel = 'manifest';
    link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
  } catch (_) {}
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1'))
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  // 禁用双指缩放 / 双击缩放 / 长按菜单 / 回弹（滚动面板除外）
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if (!e.target.closest('.panel, #testList')) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  document.addEventListener('contextmenu', e => e.preventDefault());
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouchEnd < 300 && !e.target.closest('button')) e.preventDefault(); lastTouchEnd = n; }, { passive: false });
  window.isTouchDevice = navigator.maxTouchPoints > 1;     // iPadOS Safari 伪装 Mac，用触点数判断
  if (!window.isTouchDevice) Input.setMode('keyboard');    // 桌面默认隐藏虚拟按键，触摸后恢复
})();

/* =====================================================================
   14. 启动 & 调试入口
   ===================================================================== */
Game.boot();
window.BUBBLE = { CONFIG, THEME, STAGES, Logic, Layout, Input, AI, Renderer, Sound, Store, UI, Game, Tests,
  controllers: { TouchController, KeyboardController, GamepadController, MergeController, DummyController, AIController },
  get state() { return Game.state; } };
</script>
