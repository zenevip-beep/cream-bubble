      spawn({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, size: c * (0.04 + Math.random() * 0.05), color: Math.random() < 0.6 ? '#fff' : '#ffd1e3', life: 0.5 + Math.random() * 0.3 }); } },
    shards(cx, cy, c) { for (let i = 0; i < 9; i++) { const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 200;
      spawn({ kind: 'chunk', x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 160, g: 900, size: c * (0.1 + Math.random() * 0.12),
        color: [THEME.boxBody, THEME.boxSide, THEME.ribbon, '#fff'][i % 4], rot: Math.random() * 6, vr: (Math.random() - 0.5) * 20, life: 0.6 + Math.random() * 0.3 }); } },
    stars(cx, cy, c) { for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; spawn({ kind: 'star', x: cx, y: cy, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120, g: 0, size: c * 0.32, life: 0.6 }); } },
    poof(cx, cy, c) { for (let i = 0; i < 14; i++) { const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 120;
      spawn({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: -60, size: c * (0.06 + Math.random() * 0.08), color: ['#fff', '#e3cbff', '#ffd1e3', '#c6f4ea'][i % 4], life: 0.7 }); } },
    text(cx, cy, t, color, c) { spawn({ kind: 'text', x: cx, y: cy, vx: 0, vy: -70, g: 40, size: Math.max(16, c * 0.34), color, text: t, life: 0.9 }); },
  };

  /* —— 地图内元素 —— */
  function drawItem(g, type, x, y, c, t) {
    const bob = Math.sin(t * 4 + x * 0.1) * c * 0.04;
    g.fillStyle = 'rgba(122,68,54,.12)'; ell(g, x, y + c * 0.3, c * 0.24, c * 0.06); g.fill();
    g.fillStyle = THEME.itemBg[type]; rr(g, x - c * 0.32, y - c * 0.32 + bob, c * 0.64, c * 0.6, c * 0.18); g.fill();
    g.strokeStyle = '#fff'; g.lineWidth = Math.max(2, c * 0.05); g.stroke();
    drawEmoji(g, THEME.items[type], x, y - c * 0.02 + bob, c * 0.42);
  }
  function drawBubble(g, b, c, t) {
    const off = b.slide ? b.slide.prog : 0;
    const x = (b.x + (b.slide ? b.slide.dx * off : 0) + 0.5) * c, y = (b.y + (b.slide ? b.slide.dy * off : 0) + 0.5) * c;
    const frac = Math.max(0, b.t / b.fuse);
    const pulse = 1 + Math.sin(t * (6 + (1 - frac) * 18)) * (0.03 + (1 - frac) * 0.05);
    const r = c * 0.36 * pulse;
    g.fillStyle = 'rgba(122,68,54,.15)'; ell(g, x, y + c * 0.32, c * 0.26, c * 0.07); g.fill();
    const gr = g.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.45, '#ffe3ee'); gr.addColorStop(1, '#ff9ec7');
    g.fillStyle = gr; ell(g, x, y, r, r * 0.95); g.fill();
    // 奶油尖
    g.fillStyle = '#fffaf3'; ell(g, x, y - r * 0.78, r * 0.38, r * 0.22); g.fill(); ell(g, x + r * 0.05, y - r * 0.98, r * 0.16, r * 0.14); g.fill();
    g.fillStyle = 'rgba(255,255,255,.85)'; ell(g, x - r * 0.42, y - r * 0.2, r * 0.12, r * 0.2, 0.4); g.fill();
    // 倒计时收缩圈
    g.lineCap = 'round';
    g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = c * 0.07; g.beginPath(); g.arc(x, y, c * 0.45, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = frac < 0.32 ? '#ff4f6d' : THEME.pink; g.lineWidth = c * 0.055;
    g.beginPath(); g.arc(x, y, c * 0.45, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); g.stroke();
  }
  function drawFlame(g, f, c) {
    const ph = 1 - f.t / CONFIG.bubble.flameTime;                 // 0→1
    const k = ph < 0.15 ? ph / 0.15 : 1 - Math.max(0, (ph - 0.55) / 0.45) * 0.75;
    const w = c * 0.7 * k, cx = (f.x + 0.5) * c, cy = (f.y + 0.5) * c;
    const layer = (ww, col) => {
      g.fillStyle = col;
      if (f.dir === 'c' || f.dir === 'x') { ell(g, cx, cy, ww * 0.62, ww * 0.62); g.fill(); if (f.dir === 'x') { rr(g, cx - c / 2, cy - ww / 2, c, ww, ww / 2); g.fill(); rr(g, cx - ww / 2, cy - c / 2, ww, c, ww / 2); g.fill(); } return; }
      const h = f.dir === 'left' || f.dir === 'right';
      const sgn = (f.dir === 'right' || f.dir === 'down') ? 1 : -1;
      const len = f.end ? c * 0.88 : c * 1.02;
      // 从靠近源头的一侧开始
      const start = -sgn * c / 2 - sgn * 0.01;
      if (h) { const x0 = sgn > 0 ? cx + start : cx + start - len; rr(g, x0, cy - ww / 2, len, ww, f.end ? ww / 2 : ww * 0.2); g.fill(); }
      else { const y0 = sgn > 0 ? cy + start : cy + start - len; rr(g, cx - ww / 2, y0, ww, len, f.end ? ww / 2 : ww * 0.2); g.fill(); }
    };
    layer(w, '#ffb6d0'); layer(w * 0.68, '#fff3f8'); layer(w * 0.36, '#ffffff');
  }
  function drawTrapBubble(g, x, y, c, t, frac) {
    const r = c * 0.52;
    const gr = g.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,.55)'); gr.addColorStop(0.7, 'rgba(220,240,255,.18)'); gr.addColorStop(1, 'rgba(255,200,240,.4)');
    g.fillStyle = gr; ell(g, x, y, r, r); g.fill();
    const a = t * 2;
    const lg = g.createLinearGradient(x + Math.cos(a) * r, y + Math.sin(a) * r, x - Math.cos(a) * r, y - Math.sin(a) * r);
    ['#ff8fb5', '#ffd35c', '#8fe6cb', '#6fc8ff', '#b59cff', '#ff8fb5'].forEach((col, i) => lg.addColorStop(i / 5, col));
    g.strokeStyle = lg; g.lineWidth = c * 0.06; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.85)'; ell(g, x - r * 0.45, y - r * 0.45, r * 0.16, r * 0.09, -0.7); g.fill();
    // 剩余时间
    g.strokeStyle = '#ff4f6d'; g.lineWidth = c * 0.04; g.beginPath(); g.arc(x, y, r + c * 0.06, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); g.stroke();
  }

  /* —— HUD —— */
  function card(g, r) {
    g.save(); g.shadowColor = 'rgba(214,86,138,.2)'; g.shadowBlur = 10; g.shadowOffsetY = 3;
    rr(g, r.x, r.y, r.w, r.h, 16); g.fillStyle = 'rgba(255,255,255,.9)'; g.fill(); g.restore();
    g.strokeStyle = THEME.pink3; g.lineWidth = 2; rr(g, r.x, r.y, r.w, r.h, 16); g.stroke();
  }
  function text(g, str, x, y, size, color, align = 'center', weight = 800) {
    g.font = `${weight} ${size}px ${THEME.font}`; g.textAlign = align; g.textBaseline = 'middle'; g.fillStyle = color; g.fillText(str, x, y);
  }
  function drawHud(g, s, t) {
    const H = L.hud, me = s.players.find(p => p.human); if (!me) return;
    const v = H.vertical;
    // 计时
    card(g, H.timer);
    const sec = Math.ceil(s.timeLeft), mm = Math.floor(sec / 60), ss = String(sec % 60).padStart(2, '0');
    const warn = sec <= 30;
    const sz = v ? 28 : 21;
    const scale = warn && sec <= CONFIG.match.lastBeeps ? 1 + Math.max(0, Math.sin(t * Math.PI * 2)) * 0.12 : 1;
    g.save(); g.translate(H.timer.x + H.timer.w / 2, H.timer.y + H.timer.h / 2); g.scale(scale, scale);
    text(g, `⏱ ${mm}:${ss}`, 0, 1, sz, warn ? '#ff4f6d' : THEME.choco); g.restore();
    // 对手
    card(g, H.foes);
    const foes = s.players.filter(p => p.team !== me.team);
    const alive = foes.filter(p => p.state !== 'dead').length;
    const hs = v ? 30 : Math.min(30, (H.foes.w - 16) / Math.max(1, foes.length));
    const hy = v ? H.foes.y + 44 : H.foes.y + H.foes.h / 2 + 2;
    if (v) text(g, `对手 ${alive}/${foes.length}`, H.foes.x + H.foes.w / 2, H.foes.y + 16, 15, THEME.choco, 'center', 700);
    foes.forEach((p, i) => {
      const x = H.foes.x + H.foes.w / 2 + (i - (foes.length - 1) / 2) * hs * 1.15;
      g.globalAlpha = p.state === 'dead' ? 0.35 : 1;
      drawCharacter(g, p.charKey, x, hy + (v ? 0 : -2), hs * 0.95, { gray: p.gray, time: t });
      g.globalAlpha = 1;
      if (p.state === 'dead') text(g, '✕', x, hy - 2, hs * 0.8, '#ff4f6d');
      else if (p.state === 'trapped') drawEmoji(g, '🫧', x + hs * 0.35, hy - hs * 0.35, hs * 0.4);
    });
    // 属性
    card(g, H.stats);
    const rows = [
      ['🍬', `${me.stats.bubbles}`, CONFIG.limits.bubbles, '泡泡'], ['🍫', `${me.stats.power}`, CONFIG.limits.power, '威力'],
      ['🥤', `${me.stats.speed}`, CONFIG.limits.speed, '速度'], ['🍭', `${me.lollipop}`, CONFIG.limits.lollipop, '自救'],
      ['🧤', me.glove ? '✓' : '—', null, '推泡'],
    ];
    if (v) {
      const S = H.stats;
      drawCharacter(g, me.charKey, S.x + 26, S.y + 24, 32, { time: t });
      text(g, THEME.chars[me.charKey].name, S.x + 46, S.y + 22, 17, THEME.pink, 'left');
      rows.forEach((r, i) => {
        const y = S.y + 56 + i * 27;
        drawEmoji(g, r[0], S.x + 22, y, 18);
        text(g, r[3], S.x + 40, y, 15, THEME.choco, 'left', 600);
        text(g, r[2] ? `${r[1]}/${r[2]}` : r[1], S.x + S.w - 14, y, 17, THEME.choco, 'right');
      });
      const cy = S.y + S.h - 18;
      if (me.curse) text(g, `💀 ${THEME.curseName[me.curse.type]} ${Math.ceil(me.curse.t)}s`, S.x + S.w / 2, cy, 15, '#8a5ad0', 'center', 800);
      else text(g, '状态良好 ✨', S.x + S.w / 2, cy, 15, '#3fb894', 'center', 700);
    } else {
      const S = H.stats, list = me.curse ? rows.concat([['💀', `${Math.ceil(me.curse.t)}s`, null]]) : rows;
      const cw = S.w / list.length;
      list.forEach((r, i) => {
        const x = S.x + cw * i + cw / 2;
        drawEmoji(g, r[0], x - Math.min(14, cw * 0.22), S.y + S.h / 2, 18);
        text(g, r[1], x + Math.min(14, cw * 0.22), S.y + S.h / 2 + 1, 16, r[0] === '💀' ? '#8a5ad0' : THEME.choco, 'center');
      });
    }
  }

  /* —— 虚拟操控 —— */
  function drawControls(g, s, view, t) {
    const me = s.players.find(p => p.human);
    for (const z of L.zones) {
      const iz = view.touch[z.slot]; if (!iz) continue;
      // 操控区提示
      g.save(); g.setLineDash([8, 8]); g.strokeStyle = 'rgba(255,111,168,.28)'; g.lineWidth = 2;
      rr(g, z.move.x + 2, z.move.y + 2, z.move.w - 4, z.move.h - 4, 22); g.stroke(); g.restore();
      // 摇杆
      const j = iz.joy, R = z.joyR;
      const cx = j.active ? j.cx : z.joyHome.x, cy = j.active ? j.cy : z.joyHome.y;
      g.globalAlpha = j.active ? 1 : (view.settings.joyFixed ? 0.8 : 0.4);
      g.fillStyle = 'rgba(255,255,255,.55)'; ell(g, cx, cy, R, R); g.fill();
      g.strokeStyle = THEME.pink2; g.lineWidth = 3; g.stroke();
      // 方向高亮
      if (j.active && iz.dir) {
        const ang = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[iz.dir];
        g.fillStyle = 'rgba(255,111,168,.28)'; g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R, ang - Math.PI / 4, ang + Math.PI / 4); g.closePath(); g.fill();
      }
      for (const a of [0, Math.PI / 2, Math.PI, -Math.PI / 2]) {
        g.fillStyle = THEME.pink2; const ax = cx + Math.cos(a) * R * 0.78, ay = cy + Math.sin(a) * R * 0.78;
        g.beginPath(); g.moveTo(ax + Math.cos(a) * 7, ay + Math.sin(a) * 7); g.lineTo(ax + Math.cos(a + 2.2) * 7, ay + Math.sin(a + 2.2) * 7); g.lineTo(ax + Math.cos(a - 2.2) * 7, ay + Math.sin(a - 2.2) * 7); g.closePath(); g.fill();
      }
      let kx = 0, ky = 0;
      if (j.active) { kx = j.x - j.cx; ky = j.y - j.cy; const d = Math.hypot(kx, ky), m = R * 0.55; if (d > m) { kx *= m / d; ky *= m / d; } }
      const kg = g.createRadialGradient(cx + kx - 8, cy + ky - 8, 3, cx + kx, cy + ky, R * 0.45);
      kg.addColorStop(0, '#fff'); kg.addColorStop(1, THEME.pink);
      g.fillStyle = kg; ell(g, cx + kx, cy + ky, R * 0.42, R * 0.42); g.fill();
      g.globalAlpha = 1;
      if (!j.active && !view.settings.joyFixed) text(g, '按住任意处移动', z.move.x + z.move.w / 2, z.move.y + 22, 15, 'rgba(122,68,54,.45)', 'center', 700);
      // 泡泡按钮
      const b = z.bomb, pressed = iz.bombDown != null, sc = pressed ? 0.9 : 1;
      const left = me ? me.stats.bubbles - Logic.countOwned(s, me.id) : 0;
      g.save(); g.translate(b.x, b.y); g.scale(sc, sc);
      g.fillStyle = '#e0508c'; ell(g, 0, 6, b.r, b.r); g.fill();
      const bg = g.createRadialGradient(-b.r * 0.3, -b.r * 0.4, 4, 0, 0, b.r);
      bg.addColorStop(0, '#ffd1e3'); bg.addColorStop(1, THEME.pink);
      g.fillStyle = bg; ell(g, 0, 0, b.r, b.r); g.fill();
      g.strokeStyle = '#fff'; g.lineWidth = 4; g.stroke();
      drawEmoji(g, '🫧', 0, -b.r * 0.12, b.r * 0.72);
      text(g, '泡泡', 0, b.r * 0.55, 15, '#fff');
      // 剩余数徽标
      g.fillStyle = '#fff'; ell(g, b.r * 0.68, -b.r * 0.68, 16, 16); g.fill();
      text(g, String(Math.max(0, left)), b.r * 0.68, -b.r * 0.68 + 1, 16, THEME.pink);
      g.restore();
      // 自救按钮
      const r = z.rescue, has = me && me.lollipop > 0, trappedNow = me && me.state === 'trapped';
      const rp = iz.rescueDown != null ? 0.9 : 1;
      g.save(); g.translate(r.x, r.y); g.scale(rp, rp);
      g.globalAlpha = has ? 1 : 0.45;
      if (has && trappedNow) { g.fillStyle = `rgba(255,211,92,${0.35 + 0.3 * Math.sin(t * 10)})`; ell(g, 0, 0, r.r * 1.3, r.r * 1.3); g.fill(); }
      g.fillStyle = has ? '#d49a12' : '#9c969a'; ell(g, 0, 5, r.r, r.r); g.fill();
      g.fillStyle = has ? THEME.lemon : '#cfcacd'; ell(g, 0, 0, r.r, r.r); g.fill();
      g.strokeStyle = '#fff'; g.lineWidth = 3; g.stroke();
      drawEmoji(g, '🍭', 0, -r.r * 0.1, r.r * 0.75);
      g.fillStyle = '#fff'; ell(g, r.r * 0.7, -r.r * 0.7, 13, 13); g.fill();
      text(g, String(me ? me.lollipop : 0), r.r * 0.7, -r.r * 0.7 + 1, 15, '#d49a12');
      g.restore(); g.globalAlpha = 1;
    }
  }

  /* —— 主绘制 —— */
  function draw(v) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    updateParticles(v.paused ? 0 : v.dt);
    const s = v.state;
    if (!s || !v.inGame || !L) return;
    if (staticDirty) buildStatic(s);
    const c = L.cell, M = L.map, t = v.time, a = v.alpha;
    let ox = 0, oy = 0;
    if (shakeT > 0 && !v.paused) { shakeT -= v.dt; const k = shakeAmp * Math.max(0, shakeT / 0.3); ox = (Math.random() * 2 - 1) * k; oy = (Math.random() * 2 - 1) * k; }
    ctx.save(); ctx.translate(M.x + ox, M.y + oy);
    // 外框
    ctx.save(); ctx.shadowColor = 'rgba(214,86,138,.3)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
    rr(ctx, -7, -7, M.w + 14, M.h + 14, 18); ctx.fillStyle = THEME.frame; ctx.fill(); ctx.restore();
    rr(ctx, -3, -3, M.w + 6, M.h + 6, 14); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.drawImage(sc, 0, 0, M.w, M.h);
    // 道具
    for (let k = 0; k < s.items.length; k++) if (s.items[k]) drawItem(ctx, s.items[k], (k % s.cols + 0.5) * c, ((k / s.cols | 0) + 0.5) * c, c, t);
    // 预警格
    const dm = Logic.getDangerMap(s), warn = CONFIG.bubble.warnTime;
    const pulse = 0.5 + 0.5 * Math.sin(t * 16);
    for (let k = 0; k < dm.length; k++) {
      const d = dm[k];
      if (d > 0 && d <= warn) { ctx.fillStyle = `rgba(255,70,95,${0.16 + 0.2 * pulse})`; rr(ctx, (k % s.cols) * c + 2, (k / s.cols | 0) * c + 2, c - 4, c - 4, c * 0.2); ctx.fill(); }
    }
    for (const b of s.bubbles) drawBubble(ctx, b, c, t);
    for (const f of s.flames) drawFlame(ctx, f, c);
    // 角色（按 y 排序）
    const list = s.players.filter(p => p.state !== 'dead').map(p => ({ p, x: p.px + (p.x - p.px) * a, y: p.py + (p.y - p.py) * a })).sort((A, B) => A.y - B.y);
    for (const { p, x, y } of list) {
      const px = (x + 0.5) * c, py = (y + 0.5) * c;
      if (p.state === 'trapped') {
        const sway = Math.sin(t * 7 + p.id) * c * 0.07;
        drawCharacter(ctx, p.charKey, px + sway, py - c * 0.12, c * 0.86, { dir: 'down', gray: p.gray, outline: p.human, trapped: true, time: t });
        drawTrapBubble(ctx, px + sway, py - c * 0.1, c, t, Math.max(0, p.trapT / CONFIG.trap.time));
      } else {
        if (p.invuln > 0 && Math.floor(t * 12) % 2) ctx.globalAlpha = 0.45;
        if (p.curse) { ctx.fillStyle = `rgba(160,100,220,${0.18 + 0.1 * Math.sin(t * 8)})`; ell(ctx, px, py, c * 0.5, c * 0.48); ctx.fill(); }
        drawCharacter(ctx, p.charKey, px, py, c, { dir: p.dir, phase: p.walk, moving: p.moving, gray: p.gray, outline: p.human, time: t });
        ctx.globalAlpha = 1;
        if (p.curse) drawEmoji(ctx, '💀', px + c * 0.34, py - c * 0.5, c * 0.28);
      }
      if (p.human) {   // 头顶箭头
        const ay = py - c * 0.92 + Math.sin(t * 5) * c * 0.06 - (p.state === 'trapped' ? c * 0.12 : 0);
        ctx.beginPath(); ctx.moveTo(px - c * 0.15, ay - c * 0.12); ctx.lineTo(px + c * 0.15, ay - c * 0.12); ctx.lineTo(px, ay + c * 0.06); ctx.closePath();
        ctx.lineJoin = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke(); ctx.fillStyle = THEME.pink; ctx.fill();
      }
    }
    drawParticles(ctx);
    // 开场倒计时
    if (s.phase === 'countdown') {
      const n = Math.ceil(s.countdown), f = s.countdown - Math.floor(s.countdown);
      const sc2 = 1 + f * 0.5;
      ctx.save(); ctx.translate(M.w / 2, M.h / 2); ctx.scale(sc2, sc2);
      ctx.font = `900 ${c * 2.2}px ${THEME.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 10; ctx.strokeStyle = '#fff'; ctx.strokeText(String(n), 0, 0); ctx.fillStyle = THEME.pink; ctx.fillText(String(n), 0, 0);
      ctx.restore();
    } else if (s.time < 0.7) {
      ctx.globalAlpha = 1 - s.time / 0.7;
      ctx.font = `900 ${c * 1.6}px ${THEME.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 10; ctx.strokeStyle = '#fff'; ctx.strokeText('开始！', M.w / 2, M.h / 2); ctx.fillStyle = '#3fb894'; ctx.fillText('开始！', M.w / 2, M.h / 2);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    // 被困：屏幕边缘泛红
    const me = s.players.find(p => p.human);
    if (me && me.state === 'trapped') {
      const k = 0.35 + 0.2 * Math.sin(t * 9);
      const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
      vg.addColorStop(0, 'rgba(255,40,70,0)'); vg.addColorStop(1, `rgba(255,40,70,${k})`);
      ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    }
    drawHud(ctx, s, t);
    if (v.showControls) drawControls(ctx, s, v, t);
  }

  function init(canvas) { cv = canvas; ctx = cv.getContext('2d'); }
  function resize(vw, vh, layout) {
    W = vw; H = vh; L = layout;
    cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
    cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
    staticDirty = true; emojiCache.clear(); clearFx();
  }
  function clearFx() { for (const p of P) p.on = false; shakeT = 0; }
  function shake(amp) { shakeAmp = Math.max(shakeAmp * (shakeT > 0 ? 1 : 0), amp); shakeT = 0.3; }
  const cellCenter = (x, y) => [(x + 0.5) * L.cell, (y + 0.5) * L.cell];
  function getLayout() { return L; }
  return { init, resize, draw, drawCharacter, markStaticDirty: () => { staticDirty = true; }, clearFx, shake, fx, cellCenter, getLayout };
})();

/* =====================================================================
   7. Sound：Web Audio 程序化合成，首次触摸解锁
   ===================================================================== */
const Sound = (() => {
  let ac = null, master = null, muted = false, noiseBuf = null;
  function unlock() {
    try {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        ac = new AC(); master = ac.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.6, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const b = ac.createBuffer(1, 1, 22050), src = ac.createBufferSource(); src.buffer = b; src.connect(ac.destination); src.start(0);
      }
      if (ac.state === 'suspended') ac.resume();
    } catch (_) {}
  }
  function tone(f0, f1, dur, type = 'sine', vol = 0.3, delay = 0) {
    if (!ac || muted) return;
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(dur, vol, freq, delay = 0) {
    if (!ac || muted) return;
    const t = ac.currentTime + delay, src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(120, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + dur + 0.02);
  }
  const notes = (arr, type, vol, gap) => arr.forEach((f, i) => tone(f, 0, gap * 1.6, type, vol, i * gap));
  const sfx = {
    place() { tone(620, 280, 0.12, 'sine', 0.35); },
    explode() { noise(0.42, 0.55, 1600); tone(190, 55, 0.32, 'triangle', 0.4); },
    trap() { tone(300, 900, 0.28, 'sine', 0.25); tone(450, 1300, 0.28, 'triangle', 0.12, 0.06); },
    rescue() { notes([523, 659, 784, 1047], 'triangle', 0.25, 0.07); },
    eliminate() { tone(700, 110, 0.5, 'square', 0.13); noise(0.25, 0.2, 3000, 0.05); },
    pickup() { tone(880, 1320, 0.1, 'sine', 0.3); tone(1320, 1760, 0.12, 'sine', 0.22, 0.08); },
    curse() { tone(320, 160, 0.35, 'sawtooth', 0.1); tone(330, 170, 0.35, 'sawtooth', 0.08, 0.02); },
    win() { notes([523, 659, 784, 659, 784, 1047], 'triangle', 0.28, 0.12); },
    lose() { notes([523, 466, 415, 311], 'triangle', 0.25, 0.2); },
    countdown() { tone(660, 0, 0.14, 'square', 0.14); },
    go() { tone(990, 0, 0.32, 'square', 0.16); },
    tick() { tone(1050, 0, 0.07, 'square', 0.1); },
    push() { tone(220, 340, 0.08, 'triangle', 0.22); },
    click() { tone(760, 0, 0.05, 'sine', 0.14); },
  };
  function setMuted(m) { muted = !!m; if (master) master.gain.value = muted ? 0 : 0.6; }
  return Object.assign({ unlock, setMuted, isMuted: () => muted }, sfx);
})();

/* =====================================================================
   8. Store：localStorage 存档（try/catch 包裹）
   ===================================================================== */
const Store = {
  data: { settings: { lefty: false, btnSize: 'M', joyFixed: false, mute: false }, best: { score: 0, kills: 0, time: 0 } },
  load() {
    try {
      const raw = localStorage.getItem(CONFIG.storeKey);
      if (raw) { const d = JSON.parse(raw); Object.assign(this.data.settings, d.settings || {}); Object.assign(this.data.best, d.best || {}); }
    } catch (_) {}
  },
  save() { try { localStorage.setItem(CONFIG.storeKey, JSON.stringify(this.data)); } catch (_) {} },
};

/* =====================================================================
   9. UI：DOM 菜单、设置、结算、条纹过场
   ===================================================================== */
const UI = (() => {
  const $ = id => document.getElementById(id);
  let current = 'scrMenu', settingsFrom = 'scrMenu', testsFrom = 'scrMenu', busy = false;
  function apply(id) {
    document.querySelectorAll('.screen').forEach(e => e.classList.toggle('show', e.id === id));
    current = id; Game.onScreen(id);
    if (id === 'scrMenu') renderBest();
    if (id === 'scrSettings') renderSettings();
  }
  function show(id, mid, instant) {
    if (instant) { mid && mid(); apply(id); return; }
    if (busy) return; busy = true;
    const w = $('wipe'); w.className = 'in';
    setTimeout(() => {
      mid && mid(); apply(id); w.className = 'out';
      setTimeout(() => { w.className = 'noanim'; void w.offsetWidth; w.className = ''; busy = false; }, 380);
    }, 380);
  }
  function renderBest() {
    const b = Store.data.best;
    $('bestLine').textContent = b.score ? `🏅 最高分 ${b.score} · 最多击败 ${b.kills}` : '🍰 还没有记录，来一局吧！';
  }
  function renderSettings() {
    document.querySelectorAll('.seg').forEach(seg => {
      const v = String(Store.data.settings[seg.dataset.key]);
      seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.val === v));
    });
  }
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  function showResult(r) {
    $('resEmoji').textContent = r.win ? '🏆' : (r.reason === 'timeout' ? '⏰' : '🫧');
    $('resTitle').textContent = r.win ? '胜利！' : '失败了…';
    $('resReason').textContent = r.win ? '所有木头人都被淘汰啦' : (r.reason === 'timeout' ? '时间到，还有木头人没被淘汰' : '草莓兔被淘汰了');
    $('resKills').textContent = r.kills; $('resTime').textContent = fmt(r.survive);
    $('resScore').textContent = r.score; $('resBest').textContent = Store.data.best.score;
    $('resNew').textContent = r.newBest ? '✨ 新纪录！✨' : '';
    show('scrResult');
  }
  function showTests(out) {
    $('testSum').textContent = `${out.pass === out.total ? '✅' : '❌'} 通过 ${out.pass} / ${out.total}`;
    $('testList').innerHTML = out.res.map(r => `<div>${r.pass ? '✅' : '❌'} ${r.name}${r.info ? ` <small>${r.info}</small>` : ''}</div>`).join('');
  }
  function openTests() { testsFrom = current === 'scrTests' ? testsFrom : current; showTests(Tests.run()); show('scrTests', null, true); }
  function act(a) {
    Sound.unlock(); Sound.click();
    switch (a) {
      case 'start': case 'restart': show('game', () => Game.newMatch()); break;
      case 'resume': show('game', () => Game.resume(), true); break;
      case 'menu': show('scrMenu', () => Game.quit()); break;
      case 'settings': settingsFrom = current; show('scrSettings', null, true); break;
      case 'back': show(settingsFrom, null, true); break;
      case 'tests': openTests(); break;
      case 'testsBack': show(testsFrom, null, true); break;
    }
  }
  function init() {
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (b) { act(b.dataset.act); return; }
      const sb = e.target.closest('.seg button');
      if (sb) {
        const key = sb.closest('.seg').dataset.key, raw = sb.dataset.val;
        Store.data.settings[key] = raw === 'true' ? true : raw === 'false' ? false : raw;
        Store.save(); renderSettings(); Game.applySettings(); Sound.unlock(); Sound.click();
      }
    });
    $('btnPause').addEventListener('click', () => { Sound.unlock(); Game.pause('button'); });
    renderBest();
  }
  function placePause(L) {
    const b = $('btnPause'); if (!L || !L.pause) return;
    Object.assign(b.style, { left: L.pause.x + 'px', top: L.pause.y + 'px', width: L.pause.w + 'px', height: L.pause.h + 'px' });
  }
  return { init, show, showResult, showTests, openTests, placePause, get current() { return current; } };
})();

/* =====================================================================
   10. Game：主循环（固定步长 60Hz 逻辑 + rAF 渲染）
   ===================================================================== */
const Game = (() => {
  const FIXED = CONFIG.fixedDt;
  let state = null, running = false, paused = false, acc = 0, last = 0, L = null, lastPortrait = null;
  let inGame = false, resultPending = false;
  const menuCv = document.getElementById('menuChars'), menuCtx = menuCv.getContext('2d');

  function readSafe() {
    const cs = getComputedStyle(document.getElementById('safeProbe'));
    return { top: parseFloat(cs.paddingTop) || 0, right: parseFloat(cs.paddingRight) || 0, bottom: parseFloat(cs.paddingBottom) || 0, left: parseFloat(cs.paddingLeft) || 0 };
  }
  function relayout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    L = Layout.compute(vw, vh, readSafe(), Store.data.settings);
    Renderer.resize(vw, vh, L); UI.placePause(L);
    if (lastPortrait !== null && lastPortrait !== L.portrait) pause('rotate');   // 旋转自动暂停
    lastPortrait = L.portrait;
  }
  function newMatch() {
    const seed = (Math.random() * 1e9) >>> 0;
    Input.reset();
    const p1 = new MergeController([new TouchController(Input, 0), new KeyboardController(Input)]);
    state = Logic.createState({ mapIndex: 0, seed, mode: 'practice', timeLimit: CONFIG.match.practiceTime, players: [
      { id: 1, team: 1, charKey: 'bunny', human: true, color: THEME.chars.bunny.body, controller: p1 },
      { id: 2, team: 2, charKey: 'bear', gray: true, color: THEME.gray.body, controller: new DummyController(seed + 1) },
      { id: 3, team: 2, charKey: 'cat', gray: true, color: THEME.gray.body, controller: new DummyController(seed + 2) },
      { id: 4, team: 2, charKey: 'penguin', gray: true, color: THEME.gray.body, controller: new DummyController(seed + 3) },
    ] });
    Renderer.markStaticDirty(); Renderer.clearFx();
    running = true; paused = false; acc = 0; resultPending = false;
    Sound.countdown();
  }
  function stepOnce() {
    const intents = state.players.map(p => p.controller ? p.controller.getIntent(state, p.id) : Logic.NO_INTENT);
    Logic.step(state, intents, FIXED);
    handleEvents(state.events); state.events.length = 0;
    if (state.result && !resultPending) finish();
  }
  function handleEvents(evs) {
    if (!L) return;
    const c = L.cell;
    for (const e of evs) {
      const [x, y] = e.x != null ? Renderer.cellCenter(e.x, e.y) : [0, 0];
      const me = state.players.find(p => p.human);
      switch (e.type) {
        case 'place': Sound.place(); break;
        case 'push': Sound.push(); break;
        case 'explode': Sound.explode(); Renderer.shake(CONFIG.fx.shakeBomb + Math.min(4, e.chain));
          for (const cc of e.cells) { const [a, b] = Renderer.cellCenter(cc.x, cc.y); Renderer.fx.splash(a, b, c, cc.end ? 3 : 1); } break;
        case 'box': Renderer.markStaticDirty(); Renderer.fx.shards(x, y, c); break;
        case 'trap': Sound.trap(); if (me && e.id === me.id) Renderer.shake(CONFIG.fx.shakeTrap); break;
        case 'rescue': Sound.rescue(); Renderer.fx.stars(x, y, c); Renderer.fx.text(x, y - c * 0.6, e.how === 'self' ? '🍭 自救！' : '救出！', '#3fb894', c); break;
        case 'eliminate': Sound.eliminate(); Renderer.fx.poof(x, y, c); Renderer.fx.text(x, y - c * 0.6, '淘汰！', '#ff4f6d', c); break;
        case 'pickup':
          if (e.item === 'curse') { Sound.curse(); Renderer.fx.text(x, y - c * 0.6, '💀 ' + THEME.curseName[e.curse], '#8a5ad0', c); }
          else { Sound.pickup(); Renderer.fx.text(x, y - c * 0.6, THEME.items[e.item] + ' ' + THEME.itemName[e.item], THEME.pink, c); } break;
        case 'countdown': Sound.countdown(); break;
        case 'go': Sound.go(); break;
        case 'tick': Sound.tick(); break;
      }
    }
  }
  function finish() {
    resultPending = true;
    const r = state.result, me = state.players.find(p => p.human);
    const survive = me.state === 'dead' ? me.deathTime : state.time;
    const S = CONFIG.score;
    const score = me.kills * S.kill + (r.win ? Math.ceil(state.timeLeft) * S.winTimeBonus : 0) + Math.floor(survive) * S.surviveBonus;
    const best = Store.data.best, newBest = score > best.score;
    if (newBest) best.score = score;
    best.kills = Math.max(best.kills, me.kills); best.time = Math.max(best.time, Math.floor(survive));
    Store.save();
    setTimeout(() => { r.win ? Sound.win() : Sound.lose(); }, 300);
    setTimeout(() => { if (state && state.result === r) { running = false; UI.showResult({ win: r.win, reason: r.reason, kills: me.kills, survive, score, newBest }); } }, 1300);
  }
  function pause() {
    if (!running || paused || !inGame || (state && state.result)) return;
    paused = true; Input.reset(); UI.show('scrPause', null, true);
  }
  function resume() { paused = false; acc = 0; Input.reset(); }
  function quit() { running = false; paused = false; state = null; Input.reset(); }
  function onScreen(id) {
    inGame = id === 'game' || id === 'scrPause' || id === 'scrResult' || (id === 'scrSettings' && !!state && running) || (id === 'scrTests' && !!state && running);
    document.getElementById('btnPause').classList.toggle('show', id === 'game');
  }
  function applySettings() { Sound.setMuted(Store.data.settings.mute); relayout(); }
  function drawMenu(t) {
    const g = menuCtx; g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 720, 210);
    ['bunny', 'bear', 'cat', 'penguin'].forEach((k, i) => {
      Renderer.drawCharacter(g, k, 110 + i * 166, 112, 150, { dir: 'down', moving: true, phase: t * 7 + i * 1.3, time: t, outline: i === 0 });
    });
  }
  function frame(ts) {
    requestAnimationFrame(frame);
    const now = ts / 1000; let dt = now - last; last = now;
    if (!(dt > 0)) dt = 0; if (dt > CONFIG.maxFrameDt) dt = CONFIG.maxFrameDt;
    if (running && !paused && state && UI.current === 'game') {
      acc += dt;
      while (acc >= FIXED) { stepOnce(); acc -= FIXED; }
    } else acc = 0;
    if (UI.current === 'scrMenu') drawMenu(now);
    Renderer.draw({ state, alpha: Math.min(1, acc / FIXED), time: now, dt: (paused || UI.current !== 'game') ? 0 : dt, paused: paused || UI.current !== 'game',
      inGame: inGame && !!state, showControls: Input.st.mode !== 'keyboard', touch: Input.st.touch, settings: Store.data.settings });
  }
  function boot() {
    Store.load(); Sound.setMuted(Store.data.settings.mute);
    Renderer.init(document.getElementById('game'));
    Input.attach(document.getElementById('game'), () => L, () => Store.data.settings, {
      active: () => running && !paused && UI.current === 'game',
      onPause: () => { if (UI.current === 'game') pause(); else if (UI.current === 'scrPause') UI.show('game', resume, true); },
      unlock: Sound.unlock, onMode: () => {},
    });
    UI.init(); relayout();
    window.addEventListener('resize', relayout);
    window.addEventListener('orientationchange', () => { pause(); setTimeout(relayout, 250); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
    window.addEventListener('pagehide', pause);
    window.addEventListener('blur', pause);
    window.addEventListener('pointerdown', Sound.unlock, { passive: true });
    requestAnimationFrame(frame);
    if (/[?&]test\b/.test(location.search)) setTimeout(() => UI.openTests(), 200);
  }
  return { boot, newMatch, pause, resume, quit, onScreen, applySettings, relayout, get state() { return state; }, get layout() { return L; } };
})();

/* =====================================================================
   11. Tests：?test 自动运行，或在设置中点击
   ===================================================================== */
const Tests = (() => {
  function run() {
    const res = [];
    const ok = (name, pass, info = '') => res.push({ name, pass: !!pass, info: String(info) });
    const { EMPTY, WALL, BOX } = Logic;
    const mk = rows => { const s = Logic.createEmptyState(rows[0].length, rows.length);
      rows.forEach((r, y) => [...r].forEach((ch, x) => { s.grid[y * s.cols + x] = ch === '#' ? WALL : ch === 'B' ? BOX : EMPTY; })); return s; };
    const has = (cells, x, y) => cells.some(c => c.x === x && c.y === y);
    const addB = (s, x, y, power, t = 2.5, owner = 1) => { const b = { id: s.nextId++, x, y, power, t, fuse: 2.5, owner, slide: null }; s.bubbles.push(b); return b; };
    const near = (a, b) => Math.abs(a - b) < 1e-4;
    const guard = (name, fn) => { try { fn(); } catch (e) { ok(name + '（异常）', false, e.message); } };

    // —— 爆炸范围 ——
    guard('爆炸', () => {
      let s = mk(['.#...', '.....', '.....']); let r = Logic.getBlastCells(s, addB(s, 0, 0, 3));
      ok('爆炸：墙阻挡', !has(r.cells, 1, 0) && !has(r.cells, 2, 0) && has(r.cells, 0, 1) && has(r.cells, 0, 2));
      s = mk(['..B..']); r = Logic.getBlastCells(s, addB(s, 0, 0, 4));
      ok('爆炸：箱子截断', has(r.cells, 1, 0) && has(r.cells, 2, 0) && !has(r.cells, 3, 0) && r.boxes.length === 1);
      s = mk(['.BB..']); r = Logic.getBlastCells(s, addB(s, 0, 0, 4));
      ok('爆炸：只炸第一个箱子', r.boxes.length === 1 && r.boxes[0].x === 1);
      s = mk(['.....', '.....', '.....']); const A = addB(s, 0, 1, 2); addB(s, 2, 1, 1); addB(s, 4, 1, 1);
      r = Logic.getBlastCells(s, A);
      ok('爆炸：连锁引爆', r.bubbles.length === 2 && has(r.cells, 2, 0) && has(r.cells, 2, 2) && has(r.cells, 3, 1) && !has(r.cells, 4, 0), `连锁 ${r.bubbles.length} 个`);
      // explode 集成：箱子掉落的道具不被本次水柱烧掉
      s = mk(['..B..']); s.hidden[2] = 'power'; s.items[1] = 'speed'; Logic.explode(s, addB(s, 0, 0, 3));
      ok('爆炸：箱子破碎露出道具、旧道具被烧毁', s.grid[2] === EMPTY && s.items[2] === 'power' && s.items[1] === null && s.bubbles.length === 0);
    });

    // —— 危险图 ——
    guard('危险图', () => {
      let s = mk(['.......', '.......', '.......', '.......', '.......']);
      addB(s, 1, 2, 1, 2.5); addB(s, 3, 2, 2, 0.5); addB(s, 6, 0, 1, 2.0);
      s.flameGrid[4 * 7 + 6] = 0.3;
      const dm = Logic.getDangerMap(s), at = (x, y) => dm[y * 7 + x];
      ok('危险图：连锁取最早爆炸时间', near(at(0, 2), 0.5) && near(at(1, 1), 0.5) && near(at(1, 2), 0.5), `(0,2)=${at(0, 2)}`);
      ok('危险图：独立泡泡时间', near(at(6, 1), 2.0) && near(at(5, 2), 0.5));
      ok('危险图：安全格为 Infinity、燃烧格为 0', at(0, 0) === Infinity && at(6, 4) === 0);
      s = mk(['.......', '.......']); addB(s, 0, 0, 2, 2.5); addB(s, 2, 0, 2, 1.5); addB(s, 4, 0, 2, 0.3);
      const d2 = Logic.getDangerMap(s);
      ok('危险图：三级连锁传递', near(d2[7 + 0], 0.3) && near(d2[1], 0.3), `(0,1)=${d2[7]}`);
    });

    // —— 转角辅助 ——
    guard('转角', () => {
      const P = (x, y) => Logic.makePlayer({ id: 1, team: 1 }, x, y);
      let s = mk(['.....', '.....', '.....']); let p = P(2, 0.3);
      for (let i = 0; i < 10; i++) Logic.movePlayer(s, p, 'right', 0.05);
      ok('转角：偏离 30% 自动滑入通道', p.y === 0 && p.x > 2, `x=${p.x.toFixed(2)} y=${p.y}`);
      s = mk(['.....', '...#.']); p = P(2, 0.45);
      for (let i = 0; i < 5; i++) Logic.movePlayer(s, p, 'right', 0.05);
      ok('转角：偏离超过 40% 不辅助', p.x === 2 && p.y === 0.45);
      s = mk(['.....', '.#.#.', '.....']); p = P(1.7, 0);
      for (let i = 0; i < 12; i++) Logic.movePlayer(s, p, 'down', 0.05);
      ok('转角：柱子间转入竖向通道', p.x === 2 && p.y > 0, `x=${p.x} y=${p.y.toFixed(2)}`);
      p = P(1.35, 0); s = mk(['.....', '.#.#.', '.....']);
      for (let i = 0; i < 5; i++) Logic.movePlayer(s, p, 'down', 0.05);
      ok('转角：正对墙且远离通道时不动', near(p.x, 1.35) && p.y === 0);
      s = mk(['.....']); p = P(2.3, 0); const b = Logic.placeBubble(s, p);
      ok('放泡泡：自动对齐格子中心', b && b.x === 2 && p.x === 2);
      ok('放泡泡：受泡泡数限制', Logic.placeBubble(s, (p.x = 3, p)) === null);
      s = mk(['.....']); p = P(0, 0); Logic.placeBubble(s, p);
      for (let i = 0; i < 10; i++) Logic.movePlayer(s, p, 'right', 0.1);
      ok('移动：可以走出自己的泡泡、但无法走回', p.x >= 1 && (Logic.movePlayer(s, p, 'left', 2), p.x >= 1 - 1e-6), `x=${p.x}`);
    });

    // —— 被困状态机 ——
    guard('状态机', () => {
      const setup = () => {
        const s = mk(['.........', '.........', '.........']);
        const A = Logic.makePlayer({ id: 1, team: 1 }, 0, 1), M = Logic.makePlayer({ id: 2, team: 1 }, 8, 2), E = Logic.makePlayer({ id: 3, team: 2 }, 8, 0);
        s.players.push(A, M, E); return { s, A, M, E };
      };
      const run = (s, n, intents = []) => { for (let i = 0; i < n; i++) Logic.step(s, intents, 1 / 60); };
      let { s, A, M, E } = setup();
      addB(s, 1, 1, 1, 0, 3); run(s, 1);
      ok('状态机：被水柱波及 → 被困', A.state === 'trapped' && A.trappedBy === 3);
      M.x = 0; M.y = 1.6; run(s, 1);
      ok('状态机：队友碰触 → 救出（短暂无敌）', A.state === 'alive' && A.invuln > 0);
      ({ s, A, M, E } = setup()); Logic.trapPlayer(s, A, 3);
      run(s, 1, [{ dir: null, bomb: false, rescue: true }]);
      ok('状态机：无 🍭 时自救无效', A.state === 'trapped');
      A.lollipop = 1; run(s, 1, [{ dir: null, bomb: false, rescue: true }]);
      ok('状态机：有 🍭 自救脱困并消耗', A.state === 'alive' && A.lollipop === 0);
      ({ s, A, M, E } = setup()); Logic.trapPlayer(s, A, 3); E.x = 0; E.y = 1; run(s, 1);
      ok('状态机：敌人碰触 → 淘汰并计击败', A.state === 'dead' && E.kills === 1);
      ({ s, A, M, E } = setup()); Logic.trapPlayer(s, A, 3); run(s, Math.ceil(CONFIG.trap.time * 60) + 2);
      ok('状态机：超时 3 秒 → 淘汰', A.state === 'dead' && E.kills === 1);
      ({ s, A, M, E } = setup()); Logic.trapPlayer(s, A, 3); run(s, 60);
      ok('状态机：未超时仍被困', A.state === 'trapped' && A.trapT > 0 && A.trapT < CONFIG.trap.time);
    });

    // —— 道具上限 ——
    guard('道具', () => {
      const s = mk(['...']); const p = Logic.makePlayer({ id: 1, team: 1 }, 0, 0); s.players.push(p);
      for (let i = 0; i < 30; i++) ['bubble', 'power', 'speed', 'lollipop'].forEach(t => Logic.applyItem(s, p, t));
      const Lm = CONFIG.limits;
      ok('道具：数值不超过 CONFIG 上限', p.stats.bubbles === Lm.bubbles && p.stats.power === Lm.power && p.stats.speed === Lm.speed && p.lollipop === Lm.lollipop,
        `${p.stats.bubbles}/${p.stats.power}/${p.stats.speed}/${p.lollipop}`);
      Logic.applyItem(s, p, 'curse');
      ok('道具：怪味豆随机负面 8 秒', p.curse && CONFIG.items.curses.includes(p.curse.type) && p.curse.t === CONFIG.items.curseTime);
      const s2 = mk(['...']); const q = Logic.makePlayer({ id: 1, team: 1 }, 0, 0); s2.players.push(q); s2.items[0] = 'glove';
      Logic.step(s2, [], 1 / 60);
      ok('道具：走上去自动拾取', q.glove === true && s2.items[0] === null);
    });

    // —— 推泡泡 ——
    guard('推泡泡', () => {
      const s = mk(['......']); const p = Logic.makePlayer({ id: 1, team: 1 }, 0, 0); p.glove = true; s.players.push(p);
      const b = addB(s, 1, 0, 1, 2.5);
      Logic.movePlayer(s, p, 'right', 0.1);
      for (let i = 0; i < 60; i++) Logic.step(s, [], 1 / 60);
      ok('🧤 推泡泡：滑到尽头停下', b.x === 5 && !b.slide, `x=${b.x}`);
    });

    // —— 地图生成 ——
    guard('地图', () => {
      const map = CONFIG.maps[0]; let spawnOk = true, countOk = true, ratio = 0, total = 0;
      for (let seed = 1; seed <= 30; seed++) {
        const g = Logic.generateMap(map, seed);
        for (const [sx, sy] of map.spawns) for (const [x, y] of Logic.spawnSafeCells(CONFIG.cols, CONFIG.rows, sx, sy, map.spawnClear))
          if (g.grid[y * CONFIG.cols + x] !== EMPTY) spawnOk = false;
        let n = 0, hid = 0; for (let k = 0; k < g.grid.length; k++) { if (g.grid[k] === BOX) n++; if (g.hidden[k]) hid++; }
        if (n !== g.boxCount || n < map.boxCount.min || n > map.boxCount.max) countOk = false;
        ratio += hid; total += n;
      }
      ok('地图：出生角周围 2 格为空地', spawnOk);
      ok('地图：箱子数量在 CONFIG 范围内', countOk, `${map.boxCount.min}–${map.boxCount.max}`);
      ok('地图：约 30% 箱子藏道具', Math.abs(ratio / total - CONFIG.items.dropRate) < 0.06, (ratio / total * 100).toFixed(1) + '%');
      const a = Logic.generateMap(map, 42), b = Logic.generateMap(map, 42);
      ok('地图：同种子可复现', a.grid.every((v, i) => v === b.grid[i]));
    });

    // —— 布局 ——
    guard('布局', () => {
      const views = [[1194, 834, false], [834, 1194, true], [1366, 1024, false], [678, 834, true]];
      const safe = { top: 24, bottom: 20, left: 0, right: 0 };
      const inter = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
      const box = c => ({ x: c.x - c.r, y: c.y - c.r, w: c.r * 2, h: c.r * 2 });
      for (const [vw, vh, wantPortrait] of views) {
        let pass = true, why = '', cell = 0;
        for (const btnSize of ['S', 'M', 'L']) for (const lefty of [false, true]) {
          const L = Layout.compute(vw, vh, safe, { btnSize, lefty }); cell = L.cell;
          const M = L.map, z = L.zones[0], sb = L.vh - Math.max(L.safe.bottom, CONFIG.layout.noButtonBottom);
          const fail = m => { if (pass) why = `${btnSize}${lefty ? '/左手' : ''}: ${m}`; pass = false; };
          if (L.portrait !== wantPortrait) fail('方向判断错误');
          if (M.w !== cell * CONFIG.cols || M.h !== cell * CONFIG.rows || cell > CONFIG.layout.maxCell || cell < 20) fail('格子尺寸');
          if (M.x < L.safe.left || M.y < L.safe.top || M.x + M.w > vw - L.safe.right || M.y + M.h > vh - L.safe.bottom) fail('地图越界');
          const rects = { 泡泡键: box(z.bomb), 自救键: box(z.rescue), 暂停键: L.pause, 摇杆区: z.move };
          for (const [n, r] of Object.entries(rects)) {
            if (inter(r, M)) fail(n + '与地图重叠');
            if (r.x < L.safe.left || r.y < L.safe.top || r.x + r.w > vw - L.safe.right || r.y + r.h > sb + 0.5) fail(n + '进入安全区');
          }
          if (inter(box(z.bomb), box(z.rescue))) fail('按钮互相重叠');
          if (inter(box(z.bomb), z.move) || inter(box(z.rescue), z.move)) fail('按钮与摇杆区重叠');
          if (z.bomb.r * 2 < 90 || z.rescue.r * 2 < 64 || L.pause.w < 44) fail('按钮尺寸不足');
          for (const k of ['timer', 'foes', 'stats']) if (inter(L.hud[k], M)) fail('HUD 与地图重叠');
        }
        ok(`布局：${vw}×${vh}（${wantPortrait ? '竖屏' : '横屏'}）`, pass, pass ? `格子 ${cell}pt` : why);
      }
    });

    const pass = res.filter(r => r.pass).length;
    console.table(res);
    return { pass, total: res.length, res };
  }
  return { run };
})();

/* =====================================================================
   12. PWA：Canvas 生成图标、data URL manifest、注册 sw.js、禁用 iOS 默认手势
   ===================================================================== */
(function pwa() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
    const bg = g.createLinearGradient(0, 0, 512, 512); bg.addColorStop(0, '#ffd1e3'); bg.addColorStop(1, '#c6f4ea');
    g.fillStyle = bg; g.fillRect(0, 0, 512, 512);
    g.fillStyle = 'rgba(255,255,255,.6)'; for (let i = 0; i < 9; i++) { g.beginPath(); g.arc(60 + (i % 3) * 196, 60 + ((i / 3) | 0) * 196, 16, 0, 7); g.fill(); }
    g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.arc(256, 270, 200, 0, 7); g.fill();
    g.strokeStyle = '#ff9ec7'; g.lineWidth = 14; g.stroke();
    Renderer.drawCharacter(g, 'bunny', 256, 280, 330, { dir: 'down', outline: true });
    const url = c.toDataURL('image/png');
    document.getElementById('touchIcon').href = url;
    const start = location.href.split('?')[0].split('#')[0];
    const manifest = { name: '奶油泡泡大作战', short_name: '奶油泡泡', start_url: start, scope: start.replace(/[^/]*$/, ''),
      display: 'standalone', orientation: 'any', background_color: '#ffe4ee', theme_color: '#ffc2d6',
      icons: [{ src: url, sizes: '512x512', type: 'image/png', purpose: 'any' }] };
    const link = document.createElement('link'); link.rel = 'manifest';
    link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
  } catch (_) {}
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1'))
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  // 禁用双指缩放 / 双击缩放 / 长按菜单 / 回弹（滚动面板除外）
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if (!e.target.closest('.panel, #testList')) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  document.addEventListener('contextmenu', e => e.preventDefault());
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouchEnd < 300 && !e.target.closest('button')) e.preventDefault(); lastTouchEnd = n; }, { passive: false });
  window.isTouchDevice = navigator.maxTouchPoints > 1;     // iPadOS Safari 伪装 Mac，用触点数判断
  if (!window.isTouchDevice) Input.setMode('keyboard');    // 桌面默认隐藏虚拟按键，触摸后恢复
})();

/* =====================================================================
   13. 启动 & 调试入口
   ===================================================================== */
Game.boot();
window.BUBBLE = { CONFIG, THEME, Logic, Layout, Input, Renderer, Sound, Store, UI, Game, Tests,
  controllers: { TouchController, KeyboardController, MergeController, DummyController },
  get state() { return Game.state; } };
</script>
